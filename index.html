<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Infinite Zoom Studio</title>
<style>
  :root{ --paper:#f7f6f2; --bar:#22242a; --bar-edge:#34373f; --muted:#9aa0ab; --text:#eef0f4; --accent:#2dd4bf; --accent-ink:#0b1512; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 42%, #faf9f5 0%, var(--paper) 58%, #efece4 100%);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
  #c{display:block;position:fixed;inset:0;touch-action:none}

  .bar{position:fixed;display:flex;align-items:center;gap:5px;
    padding:7px;background:color-mix(in srgb,var(--bar) 92%,transparent);backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid var(--bar-edge);border-radius:16px;box-shadow:0 8px 30px rgba(20,22,28,.28);z-index:10;
    flex-wrap:wrap;justify-content:center}
  .bar.dock-top{top:14px;left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100vw - 20px)}
  .bar.dock-bottom{bottom:14px;left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100vw - 20px)}
  .bar.dock-left{left:14px;top:50%;transform:translateY(-50%);flex-direction:column;max-height:calc(100vh - 20px)}
  .bar.dock-right{right:14px;top:50%;transform:translateY(-50%);flex-direction:column;max-height:calc(100vh - 20px)}
  .bar.dock-left .sep,.bar.dock-right .sep{width:auto;height:1px;align-self:stretch;margin:3px 4px}
  .bar.dragging{opacity:.92}
  .grip{cursor:grab;color:var(--muted);touch-action:none}
  .grip:active{cursor:grabbing}
  .grip:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .grip svg{width:16px;height:16px}
  .sep{width:1px;align-self:stretch;margin:2px 3px;background:var(--bar-edge)}
  .btn{appearance:none;border:0;cursor:pointer;height:40px;min-width:40px;padding:0 9px;display:inline-flex;
    align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--muted);border-radius:11px;
    font-size:13px;font-weight:600;transition:background .14s,color .14s,transform .06s;-webkit-tap-highlight-color:transparent}
  .btn svg{width:19px;height:19px;display:block}
  .btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .btn:active{transform:translateY(1px)}
  .btn.active{background:var(--accent);color:var(--accent-ink)}
  .btn[disabled]{opacity:.35;cursor:default}
  .btn[disabled]:hover{background:transparent;color:var(--muted)}
  .swatches{display:inline-flex;align-items:center;gap:5px}
  .sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.15);padding:0;transition:transform .1s,box-shadow .1s}
  .sw:hover{transform:scale(1.12)}
  .sw.active{box-shadow:0 0 0 2px var(--bar),0 0 0 4px #fff;transform:scale(1.12)}
  .sw-custom{position:relative;overflow:hidden}
  .sw-custom input{position:absolute;inset:-6px;width:200%;height:200%;cursor:pointer;opacity:0}
  .bgpick{position:relative;overflow:hidden}
  .bgpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .bgpick .dot{width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .sw-custom .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#f43f5e,#f59e0b,#eab308,#22c55e,#06b6d4,#6366f1,#d946ef,#f43f5e)}
  .slider{display:inline-flex;align-items:center;gap:7px;padding:0 5px}
  .slider label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  .slider input[type=range]{-webkit-appearance:none;appearance:none;width:78px;height:4px;background:#4a4e58;border-radius:999px;outline:none}
  .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar);box-shadow:0 0 0 1px var(--bar-edge)}
  .slider input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar)}

  .showtools{position:fixed;top:14px;left:14px;z-index:11;display:none;align-items:center;justify-content:center;
    width:44px;height:44px;border:1px solid var(--bar-edge);border-radius:13px;cursor:pointer;color:var(--text);
    background:color-mix(in srgb,var(--bar) 92%,transparent);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(20,22,28,.28)}
  .showtools svg{width:22px;height:22px}

  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);color:#8a8f99;font-size:12px;
    background:color-mix(in srgb,var(--bar) 80%,transparent);border:1px solid var(--bar-edge);border-radius:999px;
    padding:6px 13px;z-index:9;pointer-events:none;display:flex;gap:10px;align-items:center;white-space:nowrap;
    transition:opacity .5s;max-width:calc(100vw - 20px);overflow:hidden}
  .hint kbd{font:inherit;font-size:11px;color:var(--text);background:#33363e;border:1px solid #454953;border-bottom-width:2px;border-radius:5px;padding:1px 6px}
  .hint.fade{opacity:0}
  @media (max-width:900px){.slider.op,.hint .desktop-only{display:none}}
  @media (max-width:600px){.slider.sz{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<input type="file" id="file" accept="image/*" style="display:none">
<input type="file" id="jsonFile" accept="application/json,.json,.gz" style="display:none">

<button class="showtools" id="showTools" title="Show tools (Tab)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>

<div class="bar dock-top" id="bar">
  <button class="btn grip" id="barGrip" title="Drag to move toolbar to any edge"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>
  <button class="btn active" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7-4-4-7 7-1 5z"/><path d="M15 8l1 1"/></svg></button>
  <button class="btn" data-tool="brush" title="Brush — pressure sensitive (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c2-1 3-3 3-5"/><path d="M14 4l6 6-8 6-4-4z"/></svg></button>
  <button class="btn" data-tool="marker" title="Highlighter (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l4-7 6 3-4 7"/><path d="M9 11l-2 6 4 2 4-4"/><path d="M5 21h6"/></svg></button>
  <button class="btn" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19 19 5"/></svg></button>
  <button class="btn" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
  <button class="btn" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
  <button class="btn" id="imgBtn" data-tool="image" title="Add image (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 3 3-2 4 4"/></svg></button>
  <button class="btn" data-tool="select" title="Select / move / resize (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7 16 2-6 6-2z"/></svg></button>
  <button class="btn" data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h11"/><path d="M15.5 5.5 20 10a2 2 0 0 1 0 2.8L12 20H8l-4-4a2 2 0 0 1 0-2.8l7.7-7.7a2 2 0 0 1 2.8 0z"/></svg></button>
  <button class="btn" data-tool="hand" title="Pan (H / Space / two fingers)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11m0-1.5V5a1.5 1.5 0 0 0-3 0v6m0-5.5a1.5 1.5 0 0 0-3 0V12m0-3.5a1.5 1.5 0 0 0-3 0V15c0 3.3 2.7 6 6 6a6 6 0 0 0 6-6v-3"/></svg></button>
  <button class="btn" data-tool="loupe" title="Magnifier — hover to inspect detail (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><circle cx="11" cy="11" r="3"/><path d="m21 21-4.3-4.3"/></svg></button>

  <span class="sep"></span>
  <button class="btn" id="zoomOut" title="Zoom out (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></button>
  <button class="btn" id="zoomIn" title="Zoom in (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></button>

  <span class="sep"></span>
  <button class="btn" id="zoomOuter" title="Fly to outermost drawing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></button>
  <button class="btn" id="zoomInner" title="Fly to innermost drawing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg></button>

  <span class="sep"></span>
  <div class="swatches" id="swatches">
    <button class="sw active" style="background:#23252b" data-color="#23252b" title="Ink"></button>
    <button class="sw" style="background:#e5484d" data-color="#e5484d"></button>
    <button class="sw" style="background:#f0a020" data-color="#f0a020"></button>
    <button class="sw" style="background:#2f9e44" data-color="#2f9e44"></button>
    <button class="sw" style="background:#2d7ff9" data-color="#2d7ff9"></button>
    <button class="sw sw-custom" title="Custom color"><span class="ring"></span><input type="color" id="customColor" value="#8b5cf6"></button>
  </div>

  <span class="sep"></span>
  <label class="btn bgpick" id="bgWrap" title="Canvas color"><span class="dot" id="bgDot" style="background:#f7f6f2"></span><input type="color" id="bgColorPick" value="#f7f6f2"></label>

  <span class="sep"></span>
  <div class="slider sz"><label>size</label><input type="range" id="size" min="1" max="60" value="4"></div>
  <div class="slider op"><label>opacity</label><input type="range" id="opacity" min="5" max="100" value="100"></div>

  <span class="sep"></span>
  <button class="btn" id="undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <button class="btn" id="clear" title="New canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>

  <span class="sep"></span>
  <button class="btn" id="exportBtn" title="Export drawing (.json)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
  <button class="btn" id="importBtn" title="Import drawing (.json)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
  <button class="btn" id="fsBtn" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  <button class="btn" id="hideBtn" title="Hide toolbar (Tab)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<div class="hint" id="hint">
  <span><kbd>Scroll</kbd> / pinch to zoom — endless nested detail</span>
  <span class="desktop-only"><kbd>Space</kbd>-drag or two-finger pan · flick to coast</span>
</div>

<script>
(function(){
"use strict";
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
const layer=document.createElement("canvas"), lctx=layer.getContext("2d");   // offscreen for isolating each object's erase mask
let g=ctx;                                                                    // item-drawing target: main ctx, or the layer while masking
const fileInput=document.getElementById("file"), jsonFile=document.getElementById("jsonFile");
const ACCENT="#2dd4bf";

/* ---------------- scene graph (hidden) ---------------- */
let nid=0;
function makeNode(){ return {id:nid++, items:[], children:[], up:null, dirty:true, bbox:undefined}; }
let root=makeNode(), current=root;
let camX=0, camY=0, camScale=1;
const CHILD_K=1/6, UP_LEVELS=4, MAX_DEPTH=11;
let W=0,H=0,VIEW=1,dpr=1;

/* ---------------- tools ---------------- */
let tool="pen", color="#23252b", size=4, opacity=1;
let bgColor=null;   // canvas background colour; null = default CSS paper gradient

/* ---------------- input / physics ---------------- */
const pointers=new Map();
let mode=null, panLast=null, pinchStart=null, spaceHeld=false, cursor=null;
let draft=null, eraseSnap=null, eraseLast=null;   // eraseSnap: node -> pre-drag items clone (for undo); eraseLast: node -> last brush pos (for interpolation)
let pendingImage=null, placeAnchor=null, previewRect=null;
let selected=null, dragLast=null, resizeInfo=null, transformSnap=null;
let dirty=true;

let anim=null;   // active fly-to (outer/inner navigation); see frameToNode/stepAnim
let targetScale=1, anchorSX=0, anchorSY=0;
let pVel={x:0,y:0}, mvVel={x:0,y:0}, mvLast=null;
const ZTAU=0.09, PTAU=0.30, FLY_EFOLDS_PER_SEC=5.5;   // fly-to speed: zoom-levels crossed per second, so a long jump isn't crammed into a fixed time
let lastT=performance.now();
const history=[], future=[];

/* ---------------- sizing ---------------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  W=innerWidth; H=innerHeight; VIEW=Math.min(W,H);
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  layer.width=canvas.width; layer.height=canvas.height;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingEnabled=true;
  lctx.imageSmoothingEnabled=true;
  if(camScale===1){ camScale=VIEW; targetScale=VIEW; }
  anchorSX=W/2; anchorSY=H/2; dirty=true;
}
addEventListener("resize",resize);

const wX=px=>(px-W/2)/camScale+camX, wY=py=>(py-H/2)/camScale+camY;
const sxNow=wx=>(wx-camX)*camScale+W/2, syNow=wy=>(wy-camY)*camScale+H/2;
function hx(c){ c=c.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join(''); return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]; }

/* ---------------- dirty / bbox ---------------- */
function markDirty(node){ let n=node; while(n){ n.dirty=true; n=n.up?n.up.parent:null; } }
function nodeHasContent(node){ if(node.items.length) return true; for(const c of node.children) if(nodeHasContent(c.node)) return true; return false; }
function onCurrentPath(node){ let n=current; while(n){ if(n===node) return true; n=n.up?n.up.parent:null; } return false; }
/* Detach every frame that holds no content (and whose whole subtree is empty), except the
   frame the camera currently lives in. Returns the removed links so the change is undoable. */
function detachEmptyFrames(){
  const removed=[];
  (function rec(node){
    for(let i=node.children.length-1;i>=0;i--){
      const c=node.children[i]; rec(c.node);
      if(!nodeHasContent(c.node) && !onCurrentPath(c.node)){ node.children.splice(i,1); removed.push({parent:node,child:c,index:i}); markDirty(node); }
    }
  })(root);
  return removed;
}
function rasterOK(it){ return it.src && it.src.width && it.src.height; }
function strokeBB(it){ let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; for(const p of it.pts){ const pad=(p.w||it.base)/2; if(p.x-pad<x0)x0=p.x-pad; if(p.y-pad<y0)y0=p.y-pad; if(p.x+pad>x1)x1=p.x+pad; if(p.y+pad>y1)y1=p.y+pad; } if(!it.pts.length){x0=y0=x1=y1=0;} return {x0,y0,x1,y1}; }
function itemBounds(it){
  if(it.kind==="raster"){ const w=(it.src.width||1)*it.s,h=(it.src.height||1)*it.s; return {x0:it.x,y0:it.y,x1:it.x+w,y1:it.y+h}; }
  if(it.kind==="shape"){ const p=it.base/2; return {x0:Math.min(it.x0,it.x1)-p,y0:Math.min(it.y0,it.y1)-p,x1:Math.max(it.x0,it.x1)+p,y1:Math.max(it.y0,it.y1)+p}; }
  return it.bb || (it.bb=strokeBB(it));   // cached; invalidated on edit
}
function bboxOf(node){
  if(!node.dirty && node.bbox!==undefined) return node.bbox;
  let b=null; const ex=(x0,y0,x1,y1)=>{ if(!b) b={x0,y0,x1,y1}; else{ if(x0<b.x0)b.x0=x0; if(y0<b.y0)b.y0=y0; if(x1>b.x1)b.x1=x1; if(y1>b.y1)b.y1=y1; } };
  for(const it of node.items){ const r=itemBounds(it); ex(r.x0,r.y0,r.x1,r.y1); }
  for(const c of node.children){ const cb=bboxOf(c.node); if(cb) ex(c.x+cb.x0*c.k,c.y+cb.y0*c.k,c.x+cb.x1*c.k,c.y+cb.y1*c.k); }
  node.bbox=b; node.dirty=false; return b;
}

/* ---------------- rendering ---------------- */
const nSX=(cam,x)=>(x-cam.x)*cam.scale+W/2, nSY=(cam,y)=>(y-cam.y)*cam.scale+H/2;
/* A stroke/dab wider than a couple of viewports looks identical once it covers the
   screen, but feeding the rasterizer an enormous (or fly-to-transient near-infinite)
   width/radius can hang it — so we clamp draw widths without a size-based content cull. */
const capPx=v=>{ const m=(W+H)*2; return v>m?m:v; };
/* Item drawing targets `g` — normally the main ctx, but the offscreen layer while
   an object is being rendered in isolation so its erase mask affects only itself. */
/* `p.e` marks a point the eraser has (transiently, mid-drag) removed; the stroke is drawn
   as the runs of surviving points, so a gap opens live where the brush passes. On commit
   the runs become independent strokes (splitStroke) and the flags are gone. */
function drawStrokeItem(it,cam){
  const p=it.pts;
  if(it.mode==="brush"){
    g.fillStyle=it.color;
    for(let i=0;i<p.length;i++){ if(p[i].e) continue;
      if(i+1<p.length&&!p[i+1].e){
        const ax=nSX(cam,p[i].x),ay=nSY(cam,p[i].y),bx=nSX(cam,p[i+1].x),by=nSY(cam,p[i+1].y);
        const ra=capPx(Math.max(.4,p[i].w*cam.scale/2)), rb=capPx(Math.max(.4,p[i+1].w*cam.scale/2));
        const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
        g.beginPath(); g.moveTo(ax+nx*ra,ay+ny*ra); g.lineTo(bx+nx*rb,by+ny*rb); g.lineTo(bx-nx*rb,by-ny*rb); g.lineTo(ax-nx*ra,ay-ny*ra); g.closePath(); g.fill();
      }
      g.beginPath(); g.arc(nSX(cam,p[i].x),nSY(cam,p[i].y),capPx(Math.max(.4,p[i].w*cam.scale/2)),0,6.2832); g.fill();
    }
    return;
  }
  const lw=capPx(Math.max(.4,it.base*cam.scale*(it.mode==="marker"?2.2:1)));

function undo(){ const op=history.pop(); if(!op) return;
  if(op.type==="add") applyRemove(op.node,op.item);
  else if(op.type==="erase"){ for(const r of op.removed) op.node.items.splice(Math.min(r.i,op.node.items.length),0,r.item); markDirty(op.node); }
  else if(op.type==="verase"){ for(const c of op.itemChanges){ c.node.items=c.before.slice(); markDirty(c.node); }
    for(let i=op.removed.length-1;i>=0;i--){ const r=op.removed[i]; r.parent.children.splice(r.index,0,r.child); markDirty(r.parent); } }   // re-attach pruned frames
  else if(op.type==="transform"){ setGeom(op.item,op.before); markDirty(op.node); }
  else if(op.type==="items"){ op.node.items=op.before.slice(); markDirty(op.node); }
  future.push(op); updateHist(); dirty=true; }
function redo(){ const op=future.pop(); if(!op) return;
  if(op.type==="add"){ op.node.items.push(op.item); markDirty(op.node); }
  else if(op.type==="erase"){ for(const r of [...op.removed].sort((a,b)=>b.i-a.i)){ const i=op.node.items.indexOf(r.item); if(i>=0) op.node.items.splice(i,1);} markDirty(op.node); }
  else if(op.type==="verase"){ for(const c of op.itemChanges){ c.node.items=c.after.slice(); markDirty(c.node); }
    for(const r of op.removed){ const i=r.parent.children.indexOf(r.child); if(i>=0) r.parent.children.splice(i,1); markDirty(r.parent); } }   // re-prune emptied frames
  else if(op.type==="transform"){ setGeom(op.item,op.after); markDirty(op.node); }

/* ---------------- pointer / drawing ---------------- */
const local=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
const baseWorld=()=>size/camScale;
let lastMoveT=0,lastW=0;
function brushWidth(e,speed){
  const base=baseWorld(); let scale;
  if(e && e.pointerType==="pen" && e.pressure>0) scale=0.22+1.7*e.pressure;   // real stylus pressure
  else scale=1.35-Math.min(1,speed/2.2)*0.95;                                  // mouse: faster = thinner

function startStroke(p,m,e){
  const it={kind:"stroke",mode:m,color,alpha:m==="marker"?0.32*opacity:(m==="brush"?1:opacity),base:baseWorld(),pts:[{x:wX(p.x),y:wY(p.y),w:brushWidth(e,0)}]};

}
function extendStroke(p,e){
  if(!draft) return; const last=draft.pts[draft.pts.length-1], wx=wX(p.x),wy=wY(p.y);
  const distS=Math.hypot(sxNow(wx)-sxNow(last.x),syNow(wy)-syNow(last.y));
  const now=performance.now(), dt=Math.max(1,now-lastMoveT); lastMoveT=now;
  const dx=wx-last.x,dy=wy-last.y, m=0.5/camScale;
  if(dx*dx+dy*dy>m*m){ const w=draft.mode==="brush"?brushWidth(e,distS/dt):draft.base; draft.pts.push({x:wx,y:wy,w}); const bb=draft.bb, pd=w/2; if(bb){ if(wx-pd<bb.x0)bb.x0=wx-pd; if(wy-pd<bb.y0)bb.y0=wy-pd; if(wx+pd>bb.x1)bb.x1=wx+pd; if(wy+pd>bb.y1)bb.y1=wy+pd; } markDirty(current); dirty=true; }
}
function startShape(p,shape){ const it={kind:"shape",shape,color,alpha:opacity,base:baseWorld(),x0:wX(p.x),y0:wY(p.y),x1:wX(p.x),y1:wY(p.y)}; current.items.push(it); draft=it; markDirty(current); dirty=true; }
function extendShape(p){ if(!draft) return; draft.x1=wX(p.x); draft.y1=wY(p.y); markDirty(current); dirty=true; }
function commitDraft(){ if(!draft) return; const d=draft; draft=null; lastW=0;
  if(d.kind==="shape"&&Math.hypot(sxNow(d.x1)-sxNow(d.x0),syNow(d.y1)-syNow(d.y0))<3){ applyRemove(current,d); return; }
  pushHist({type:"add",node:current,item:d}); }

/* Vector eraser: an erase drag deletes the geometry under the brush. Strokes lose the
   sample points inside the brush disk and split into independent sub-strokes across the
   gaps; shapes/images are removed whole when the brush touches them. Nothing is composited
   per frame (so it stays fast on mobile), and once a frame is emptied it is pruned.
   Width lives in world units, so zooming in erases arbitrarily fine detail. */
function eraseWorldW(){ return Math.max(4,size)/camScale; }                 // eraser diameter, screen-constant, in world units
function eraserTouches(it,ex,ey,R){                                         // does the eraser disk (world) overlap the object's painted body?
  const b=itemBounds(it);
  if(ex<b.x0-R||ex>b.x1+R||ey<b.y0-R||ey>b.y1+R) return false;             // broad phase
  if(it.kind==="raster") return true;                                       // within the image rect
  if(it.kind==="shape"){
    const hw=(it.base||1)/2+R;
    if(it.shape==="line") return segDist(ex,ey,it.x0,it.y0,it.x1,it.y1)<=hw;
    const minx=Math.min(it.x0,it.x1),maxx=Math.max(it.x0,it.x1),miny=Math.min(it.y0,it.y1),maxy=Math.max(it.y0,it.y1);
    return (ex>=minx-hw&&ex<=maxx+hw&&ey>=miny-hw&&ey<=maxy+hw)&&!(ex>minx+hw&&ex<maxx-hw&&ey>miny+hw&&ey<maxy-hw);  // near the outline ring
  }
  const p=it.pts; for(let i=0;i<p.length;i++){ const w=(p[i].w||it.base)/2+R;   // stroke: near any segment
    if(i+1<p.length){ if(segDist(ex,ey,p[i].x,p[i].y,p[i+1].x,p[i+1].y)<=w) return true; }
    else { const dx=ex-p[i].x,dy=ey-p[i].y; if(dx*dx+dy*dy<=w*w) return true; } }
  return false;
}
/* The eraser erases everything under the brush, not just the current frame. After a
   deep zoom the app rebases so content lives in an ancestor, and the LOD fill keeps it
   visible from far above the render window — so we climb the whole chain to the top,
   then DFS back down through EVERY frame the brush overlaps (ancestors, current,
   descendants and siblings), with the brush converted into each frame's coordinates. */
const ERASE_UP_CAP=48;                                                     // reach as far up as the LOD fill can show content
function eraseNodes(pt){
  let ex=wX(pt.x),ey=wY(pt.y),R=eraseWorldW()/2,w=eraseWorldW(),node=current,scale=camScale;
  for(let i=0;i<ERASE_UP_CAP && node.up;i++){ const up=node.up; ex=up.x+ex*up.k; ey=up.y+ey*up.k; R*=up.k; w*=up.k; scale/=up.k; node=up.parent; }
  const out=[], stack=[{node,ex,ey,R,w,scale}];
  while(stack.length){ const d=stack.pop(); out.push(d);
    for(const c of d.node.children){ const cs=d.scale*c.k; if(cs<0.18) continue;   // matches the render cull, so anything visible is reachable
      const b=bboxOf(c.node); if(!b) continue;                            // empty frame: nothing to erase (also skips work)
      const bx0=c.x+b.x0*c.k,by0=c.y+b.y0*c.k,bx1=c.x+b.x1*c.k,by1=c.y+b.y1*c.k;   // child CONTENT box (not the unit box) in this frame's coords
      const qx=Math.max(bx0-d.ex,d.ex-bx1,0), qy=Math.max(by0-d.ey,d.ey-by1,0);    // brush disk vs content box
      if(qx*qx+qy*qy<=d.R*d.R) stack.push({node:c.node,ex:(d.ex-c.x)/c.k,ey:(d.ey-c.y)/c.k,R:d.R/c.k,w:d.w/c.k,scale:cs}); }

function ensureSnap(node){ if(eraseSnap&&!eraseSnap.has(node)) eraseSnap.set(node,node.items.map(cloneItem)); }   // clean pre-drag copy, once per node
function insideDisk(p,cx,cy,R){ const rr=R+(p.w||0)/2, dx=p.x-cx,dy=p.y-cy; return dx*dx+dy*dy<=rr*rr; }
function circleSeg(ax,ay,bx,by,cx,cy,rr){                                  // where segment A->B crosses the circle: [t0,t1] clamped to [0,1], or null
  const dx=bx-ax,dy=by-ay,fx=ax-cx,fy=ay-cy,a=dx*dx+dy*dy; if(a<1e-12) return null;
  const b=2*(fx*dx+fy*dy),c=fx*fx+fy*fy-rr*rr; let disc=b*b-4*a*c; if(disc<0) return null; disc=Math.sqrt(disc);
  const t0=(-b-disc)/(2*a),t1=(-b+disc)/(2*a); if(t1<0||t0>1) return null; return [t0<0?0:t0,t1>1?1:t1];

/* Cut the part of a stroke that falls inside the eraser disk, inserting points exactly on
   the disk boundary plus a break marker in the gap. Only the ink under the brush is removed
   — not the whole segment between sparse sample points — so it behaves like a real eraser. */
function clipStrokeDisk(pts,cx,cy,R){
  const out=[]; let changed=false;
  const lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,w:(a.w||0)+((b.w||0)-(a.w||0))*t});
  const brk=()=>{ if(out.length&&!out[out.length-1].e) out.push({e:true}); };   // gap marker (skipped when drawing)
  for(let i=0;i<pts.length;i++){
    const A=pts[i];
    if(A.e){ brk(); continue; }
    const aIn=insideDisk(A,cx,cy,R);
    if(aIn){ brk(); changed=true; } else out.push(A);
    const B=i+1<pts.length?pts[i+1]:null; if(!B||B.e) continue;
    const rr=R+((A.w||0)+(B.w||0))/4, seg=circleSeg(A.x,A.y,B.x,B.y,cx,cy,rr); if(!seg) continue;
    const bIn=insideDisk(B,cx,cy,R),t0=seg[0],t1=seg[1];
    if(!aIn&&!bIn){ if(t0>0&&t1<1){ out.push(lerp(A,B,t0)); brk(); out.push(lerp(A,B,t1)); changed=true; } }   // bite out the middle
    else if(!aIn&&bIn){ out.push(lerp(A,B,t0)); brk(); changed=true; }                                        // cut at entry
    else if(aIn&&!bIn){ brk(); out.push(lerp(A,B,t1)); changed=true; }                                        // cut at exit
  }

/* One brush position on a stroke. If the eraser disk is at least as wide as the line is
   thick (R >= half-width) it severs the line — clip the centre geometry out (splitting the
   stroke, so fully-erased pieces vanish). If it's smaller (a small eraser on a thick line)
   it can't cut through, so we punch a masked hole in the body instead. Holes are bounded:
   consecutive stamps closer than R/2 are skipped. */
function eraseAt(node,ex,ey,R){
  let touched=false;
  for(const it of node.items){
    if(it.dead) continue;
    if(it.kind==="stroke"){
      const b=itemBounds(it);
      if(ex<b.x0-R||ex>b.x1+R||ey<b.y0-R||ey>b.y1+R) continue;             // broad phase
      const hw=(it.base||0)/2*(it.mode==="marker"?2.2:1);                  // visual half-width (markers render wider)
      if(R>=hw){                                                           // cut clean through
        const np=clipStrokeDisk(it.pts,ex,ey,R);
        if(np){ ensureSnap(node); it.pts=np; it.bb=undefined; touched=true; }
      } else {                                                             // punch a hole in the body
        if(!it.holes) it.holes=[]; const last=it.holes[it.holes.length-1];
        if(!last||Math.hypot(ex-last.x,ey-last.y)>R*0.5){ ensureSnap(node); it.holes.push({x:ex,y:ey,r:R}); touched=true; }
      }
    } else if(eraserTouches(it,ex,ey,R)){ ensureSnap(node); it.dead=true; touched=true; }

function eraseSample(pt){
  for(const t of eraseNodes(pt)){
    const last=eraseLast&&eraseLast.get(t.node);                            // interpolate along the drag so fast strokes don't skip past thin lines
    if(last){ const dx=t.ex-last.ex,dy=t.ey-last.ey,dist=Math.hypot(dx,dy);
      const n=Math.min(64,Math.max(1,Math.ceil(dist/Math.max(t.R,1e-6))));
      for(let i=1;i<=n;i++){ const f=i/n; eraseAt(t.node,last.ex+dx*f,last.ey+dy*f,t.R); } }
    else eraseAt(t.node,t.ex,t.ey,t.R);

/* Turn a stroke whose points carry `e` flags into the surviving runs (independent strokes);
   lone leftover points from a split are dropped so erasing doesn't leave stray dots. */
function splitStroke(it){
  const runs=[]; let cur=null;
  for(const p of it.pts){ if(p.e){ cur=null; } else { if(!cur){ cur=[]; runs.push(cur); } cur.push({x:p.x,y:p.y,w:p.w}); } }
  const hw=(it.base||0)/2;
  return runs.filter(r=>r.length>1).map(r=>{
    const s={kind:"stroke",mode:it.mode,color:it.color,alpha:it.alpha,base:it.base,pts:r,bb:undefined};
    if(it.holes&&it.holes.length){ const bb=strokeBB(s);                    // keep only the holes that touch this piece — don't copy every hole onto every split
      const hs=it.holes.filter(h=>h.x+h.r>=bb.x0-hw&&h.x-h.r<=bb.x1+hw&&h.y+h.r>=bb.y0-hw&&h.y-h.r<=bb.y1+hw);

function commitErase(){
  if(eraseSnap&&eraseSnap.size){
    const itemChanges=[];
    for(const [node,before] of eraseSnap){
      const after=[];
      for(const it of node.items){
        if(it.dead) continue;
        if(it.kind==="stroke"&&it.pts.some(p=>p.e)){ for(const s of splitStroke(it)) after.push(s); }
        else after.push(it);

      node.items=after; markDirty(node);
      itemChanges.push({node,before,after:after.map(cloneItem)});
    }
    const removed=detachEmptyFrames();

function hitItem(it,px,py,R){
  if(it.kind==="stroke"){ for(const q of it.pts){ const dx=sxNow(q.x)-px,dy=syNow(q.y)-py; if(dx*dx+dy*dy<=R*R) return true; } return false; }
  if(it.kind==="raster"){ const x=sxNow(it.x),y=syNow(it.y),w=(it.src.width||1)*it.s*camScale,h=(it.src.height||1)*it.s*camScale; return px>=x-R&&px<=x+w+R&&py>=y-R&&py<=y+h+R; }

  if(it.shape==="line") return segDist(px,py,x0,y0,x1,y1)<=R;
  const minx=Math.min(x0,x1),maxx=Math.max(x0,x1),miny=Math.min(y0,y1),maxy=Math.max(y0,y1);

function segDist(px,py,x0,y0,x1,y1){ const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy; let t=l2?((px-x0)*dx+(py-y0)*dy)/l2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(x0+dx*t),py-(y0+dy*t)); }
function pickItem(px,py){ const R=Math.max(10,(6)); for(let i=current.items.length-1;i>=0;i--){ if(hitItem(current.items[i],px,py,R)) return current.items[i]; } return null; }

/* ---------------- select / move / resize ---------------- */
function cloneErases(er){ return er?er.map(e=>({base:e.base,pts:e.pts.map(p=>({x:p.x,y:p.y,w:p.w}))})):undefined; }
function cloneHoles(h){ return h&&h.length?h.map(o=>({x:o.x,y:o.y,r:o.r})):undefined; }   // erase holes: world-space circle stamps
function cloneItem(it){                                                     // deep copy of an item's geometry (image src shared); no transient erase flags
  if(it.kind==="raster") return {kind:"raster",x:it.x,y:it.y,s:it.s,alpha:it.alpha,src:it.src,erases:cloneErases(it.erases)};
  if(it.kind==="shape") return {kind:"shape",shape:it.shape,color:it.color,alpha:it.alpha,base:it.base,x0:it.x0,y0:it.y0,x1:it.x1,y1:it.y1,erases:cloneErases(it.erases)};
  return {kind:"stroke",mode:it.mode,color:it.color,alpha:it.alpha,base:it.base,pts:it.pts.map(p=>({x:p.x,y:p.y,w:p.w})),erases:cloneErases(it.erases),holes:cloneHoles(it.holes),bb:undefined};
}
function geomOf(it){ const er=cloneErases(it.erases);
  if(it.kind==="raster")return{x:it.x,y:it.y,s:it.s,erases:er};
  if(it.kind==="shape")return{x0:it.x0,y0:it.y0,x1:it.x1,y1:it.y1,base:it.base,erases:er};
  return{base:it.base,pts:it.pts.map(p=>({x:p.x,y:p.y,w:p.w})),erases:er,holes:cloneHoles(it.holes)}; }
function setGeom(it,g){ if(it.kind==="raster"){it.x=g.x;it.y=g.y;it.s=g.s;} else if(it.kind==="shape"){it.x0=g.x0;it.y0=g.y0;it.x1=g.x1;it.y1=g.y1;it.base=g.base;} else {it.base=g.base; it.pts=g.pts.map(p=>({x:p.x,y:p.y,w:p.w})); it.holes=cloneHoles(g.holes); it.bb=undefined;}
  it.erases=cloneErases(g.erases); }
function translateItem(it,dx,dy){ if(it.kind==="raster"){it.x+=dx;it.y+=dy;} else if(it.kind==="shape"){it.x0+=dx;it.y0+=dy;it.x1+=dx;it.y1+=dy;} else { for(const p of it.pts){p.x+=dx;p.y+=dy;} if(it.holes) for(const h of it.holes){ h.x+=dx; h.y+=dy; } it.bb=undefined; }
  if(it.erases) for(const e of it.erases) for(const p of e.pts){ p.x+=dx; p.y+=dy; } }
function scaleFromSnap(it,snap,pvx,pvy,f){
  if(it.kind==="raster"){ it.x=pvx+(snap.x-pvx)*f; it.y=pvy+(snap.y-pvy)*f; it.s=snap.s*f; }
  else if(it.kind==="shape"){ it.x0=pvx+(snap.x0-pvx)*f; it.y0=pvy+(snap.y0-pvy)*f; it.x1=pvx+(snap.x1-pvx)*f; it.y1=pvy+(snap.y1-pvy)*f; it.base=snap.base*f; }
  else { it.base=snap.base*f; it.pts=snap.pts.map(p=>({x:pvx+(p.x-pvx)*f,y:pvy+(p.y-pvy)*f,w:p.w*f})); it.bb=undefined;

  it.erases=snap.erases?snap.erases.map(e=>({base:e.base*f,pts:e.pts.map(p=>({x:pvx+(p.x-pvx)*f,y:pvy+(p.y-pvy)*f,w:p.w*f}))})):undefined;
}
function selectPointerDown(p){
  if(selected&&current.items.indexOf(selected)>=0){
    const b=itemBounds(selected); const wc=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]];
    for(let i=0;i<4;i++){ if(Math.hypot(sxNow(wc[i][0])-p.x,syNow(wc[i][1])-p.y)<=12){
      const pv=wc[(i+2)%4], drag=wc[i]; resizeInfo={pvx:pv[0],pvy:pv[1],len:Math.max(1e-6,Math.hypot(drag[0]-pv[0],drag[1]-pv[1]))};

  }
  const it=pickItem(p.x,p.y);
  if(it){ selected=it; transformSnap=geomOf(it); dragLast={x:p.x,y:p.y}; mode="move"; }

function moveSel(p){ if(!selected) return; const dx=(p.x-dragLast.x)/camScale, dy=(p.y-dragLast.y)/camScale; translateItem(selected,dx,dy); dragLast={x:p.x,y:p.y}; markDirty(current); dirty=true; }

function endTransform(){ if(selected&&transformSnap){ const after=geomOf(selected); const changed=JSON.stringify(after)!==JSON.stringify(transformSnap); if(changed) pushHist({type:"transform",node:current,item:selected,before:transformSnap,after}); } transformSnap=null; resizeInfo=null; dragLast=null; }
function deleteSelected(){ if(!selected) return; const i=current.items.indexOf(selected); if(i>=0){ current.items.splice(i,1); pushHist({type:"erase",node:current,removed:[{item:selected,i}]}); markDirty(current); } selected=null; dirty=true; }

/* ---------------- image placement ---------------- */
function placeImage(rect){
  if(!pendingImage) return; const img=pendingImage, ar=img.width/img.height;
  let bw=rect.w, bh=rect.h, cx,cy;
  if(bw<8&&bh<8){ bw=VIEW*0.5; bh=bw/ar; cx=W/2; cy=H/2; } else { cx=rect.x+rect.w/2; cy=rect.y+rect.h/2; }
  let dw=bw, dh=dw/ar; if(dh>bh&&bh>8){ dh=bh; dw=dh*ar; }
  const it={kind:"raster",src:img,x:wX(cx-dw/2),y:wY(cy-dh/2),s:(dw/img.width)/camScale,alpha:1};
  current.items.push(it); markDirty(current); pushHist({type:"add",node:current,item:it}); dirty=true;
  pendingImage=null; previewRect=null; selected=it; setTool("select"); hintFlash("Drag to move · drag a corner to resize");
}
document.getElementById("imgBtn").addEventListener("click",()=>{ fileInput.value=""; fileInput.click(); });
fileInput.addEventListener("change",()=>{ const f=fileInput.files&&fileInput.files[0]; if(!f)return; const img=new Image();
  img.onload=()=>{ pendingImage=img; setTool("image"); hintFlash("Drag a box to place the image (or tap once)"); }; img.src=URL.createObjectURL(f); });

/* ---------------- export / import ---------------- */
function serErases(it){ return it.erases&&it.erases.length?{erases:it.erases.map(e=>({base:e.base,pts:e.pts.map(p=>({x:p.x,y:p.y,w:p.w}))}))}:null; }
function serHoles(it){ return it.holes&&it.holes.length?{holes:it.holes.map(h=>({x:h.x,y:h.y,r:h.r}))}:null; }
function serItem(it){ if(it.kind==="raster"){ let data=""; try{ if(it.src.toDataURL) data=it.src.toDataURL("image/png"); else { const cv=document.createElement("canvas"); cv.width=it.src.width; cv.height=it.src.height; cv.getContext("2d").drawImage(it.src,0,0); data=cv.toDataURL("image/png"); } }catch(e){}
    return {kind:"raster",x:it.x,y:it.y,s:it.s,alpha:it.alpha,data,...serErases(it)}; }
  if(it.kind==="shape") return {kind:"shape",shape:it.shape,color:it.color,alpha:it.alpha,base:it.base,x0:it.x0,y0:it.y0,x1:it.x1,y1:it.y1,...serErases(it)};
  return {kind:"stroke",mode:it.mode,color:it.color,alpha:it.alpha,base:it.base,pts:it.pts.map(p=>({x:p.x,y:p.y,w:p.w})),...serErases(it),...serHoles(it)}; }
function serNode(n){ return {items:n.items.map(serItem), children:n.children.map(c=>({x:c.x,y:c.y,k:c.k,node:serNode(c.node)}))}; }
function download(name,blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
function pathToCurrent(){ const p=[]; let n=current; while(n.up){ const ch=n.up, idx=ch.parent.children.indexOf(ch); p.push(idx); n=ch.parent; } return p.reverse(); }
async function exportDrawing(){
  const payload={app:"infinite-zoom-studio",version:3,bg:bgColor,view:{path:pathToCurrent(),camX,camY,sc:camScale/VIEW},root:serNode(root)};
  const data=JSON.stringify(payload);
  try{ if(window.CompressionStream){ const stream=new Blob([data]).stream().pipeThrough(new CompressionStream("gzip"));
    const blob=await new Response(stream).blob(); download("infinite-zoom-drawing.json.gz",blob); return; } }catch(e){}
  download("infinite-zoom-drawing.json",new Blob([data],{type:"application/json"}));
}
function deserItem(o,node){ if(o.kind==="raster"){ const img=new Image(); const it={kind:"raster",x:o.x,y:o.y,s:o.s,alpha:o.alpha==null?1:o.alpha,src:img,erases:o.erases}; img.onload=()=>{ markDirty(node); dirty=true; }; img.src=o.data; return it; } return o; }
function deserNode(o){ const n=makeNode(); n.items=(o.items||[]).map(it=>deserItem(it,n));
  n.children=(o.children||[]).map(c=>{ const node=deserNode(c.node); const child={x:c.x,y:c.y,k:c.k,node,parent:n}; node.up=child; return child; }); n.dirty=true; n.bbox=undefined; return n; }
function importDrawing(text){ let o; try{ o=JSON.parse(text); }catch(e){ hintFlash("Couldn't read that file"); return; }
  if(!o||!o.root){ hintFlash("Not a valid drawing file"); return; }
  root=deserNode(o.root); pVel={x:0,y:0}; selected=null; history.length=0; future.length=0; updateHist();
  let cur=root, ok=true; const v=o.view||{};                       // restore camera + which frame you were in
  for(const idx of (v.path||[])){ if(cur.children&&cur.children[idx]) cur=cur.children[idx].node; else { ok=false; break; } }
  current=ok?cur:root; camX=v.camX||0; camY=v.camY||0; camScale=(v.sc||1)*VIEW; targetScale=camScale;
  bgColor=o.bg||null; applyBg();                                   // restore saved canvas colour
  markDirty(root); dirty=true; hintFlash("Drawing loaded"); }
document.getElementById("exportBtn").onclick=exportDrawing;
document.getElementById("importBtn").onclick=()=>{ jsonFile.value=""; jsonFile.click(); };
jsonFile.addEventListener("change",()=>{ const f=jsonFile.files&&jsonFile.files[0]; if(!f)return; const r=new FileReader();
  r.onload=async()=>{ const buf=new Uint8Array(r.result); let text;
    try{ if(buf.length>2&&buf[0]===0x1f&&buf[1]===0x8b&&window.DecompressionStream){
        const stream=new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip")); text=await new Response(stream).text();
      } else text=new TextDecoder().decode(buf);
    }catch(e){ hintFlash("Couldn't read that file"); return; }
    importDrawing(text); };
  r.readAsArrayBuffer(f); });

/* ---------------- pointer handling ---------------- */
function stopMomentum(){ anim=null; targetScale=camScale; pVel.x=pVel.y=0; }
canvas.addEventListener("pointerdown",e=>{
  lastPointerType=e.pointerType||"mouse";
  canvas.setPointerCapture(e.pointerId); const p=local(e); pointers.set(e.pointerId,p); cursor=p; stopMomentum();
  mvVel={x:0,y:0}; mvLast={x:p.x,y:p.y,t:performance.now()};
  if(pointers.size===2){ if(draft){applyRemove(current,draft);draft=null;} commitErase(); mode="pinch";
    const[a,b]=[...pointers.values()]; pinchStart={dist:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,_t:performance.now()}; dirty=true; return; }
  const wantPan=tool==="hand"||spaceHeld||e.button===1||e.button===2;
  if(wantPan){ mode="pan"; panLast=p; setCursor(); return; }
  if(tool==="pen"||tool==="brush"||tool==="marker"){ mode="draw"; lastMoveT=performance.now(); lastW=0; startStroke(p,tool,e); }
  else if(tool==="line"||tool==="rect"||tool==="ellipse"){ mode="shape"; startShape(p,tool); }
  else if(tool==="eraser"){ mode="erase"; eraseSnap=new Map(); eraseLast=new Map(); eraseSample(p); }
  else if(tool==="select"){ selectPointerDown(p); }
  else if(tool==="image"){ if(pendingImage){ mode="placeimg"; placeAnchor=p; previewRect={x:p.x,y:p.y,w:0,h:0}; } else { fileInput.value=""; fileInput.click(); } }
});
canvas.addEventListener("pointermove",e=>{
  lastPointerType=e.pointerType||"mouse";
  const p=local(e); cursor=p;
  if(mvLast&&pointers.size<2){ const now=performance.now(),dt=Math.max(8,now-mvLast.t)/1000; mvVel.x=mvVel.x*0.6+((p.x-mvLast.x)/dt)*0.4; mvVel.y=mvVel.y*0.6+((p.y-mvLast.y)/dt)*0.4; mvLast={x:p.x,y:p.y,t:now}; }
  if(!pointers.has(e.pointerId)){ dirty=true; return; }
  pointers.set(e.pointerId,p);
  if(mode==="pinch"&&pointers.size>=2){
    const[a,b]=[...pointers.values()]; const dist=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    if(pinchStart.dist>0){ let ratio=Math.max(.2,Math.min(5,dist/pinchStart.dist)); const awx=wX(cx),awy=wY(cy); camScale*=ratio; camX=awx-(cx-W/2)/camScale; camY=awy-(cy-H/2)/camScale; }
    camX-=(cx-pinchStart.cx)/camScale; camY-=(cy-pinchStart.cy)/camScale;
    const nowp=performance.now(); if(pinchStart._t){ const dt=Math.max(8,nowp-pinchStart._t)/1000; mvVel.x=mvVel.x*0.6+((cx-pinchStart.cx)/dt)*0.4; mvVel.y=mvVel.y*0.6+((cy-pinchStart.cy)/dt)*0.4; }
    pinchStart={dist,cx,cy,_t:nowp}; targetScale=camScale; reframe(); dirty=true;
  }else if(mode==="pan"&&panLast){ camX-=(p.x-panLast.x)/camScale; camY-=(p.y-panLast.y)/camScale; panLast=p; dirty=true; }
  else if(mode==="draw"){ const evs=e.getCoalescedEvents?e.getCoalescedEvents():null; if(evs&&evs.length){ for(const ev of evs) extendStroke(local(ev),ev); } else extendStroke(p,e); }
  else if(mode==="shape"){ extendShape(p); }
  else if(mode==="erase"){ const evs=e.getCoalescedEvents?e.getCoalescedEvents():null; if(evs&&evs.length){ for(const ev of evs) eraseSample(local(ev)); } else eraseSample(p); dirty=true; }  // always redraw so the cursor ring tracks the drag
  else if(mode==="move"){ moveSel(p); }
  else if(mode==="resize"){ resizeSel(p); }
  else if(mode==="placeimg"&&placeAnchor){ previewRect={x:Math.min(p.x,placeAnchor.x),y:Math.min(p.y,placeAnchor.y),w:Math.abs(p.x-placeAnchor.x),h:Math.abs(p.y-placeAnchor.y)}; dirty=true; }
  else dirty=true;
});
function release(e){
  pointers.delete(e.pointerId);
  if(mode==="draw"||mode==="shape"){ commitDraft(); mode=null; }
  else if(mode==="erase"){ commitErase(); mode=null; }
  else if(mode==="move"||mode==="resize"){ endTransform(); mode=null; }
  else if(mode==="placeimg"){ placeImage(previewRect||{x:cursor.x,y:cursor.y,w:0,h:0}); placeAnchor=null; mode=null; }
  else if(mode==="pinch"){ if(pointers.size===1){ mode="pan"; panLast=[...pointers.values()][0]; mvLast={x:panLast.x,y:panLast.y,t:performance.now()}; } else if(pointers.size===0){ mode=null; pVel={x:mvVel.x,y:mvVel.y}; } }
  else if(mode==="pan"){ if(pointers.size===0){ mode=null; panLast=null; pVel={x:mvVel.x,y:mvVel.y}; } }
  if(lastPointerType==="touch"&&pointers.size===0) cursor=null;   // no hover on touch — drop the loupe when the finger lifts
  setCursor(); dirty=true;
}
canvas.addEventListener("pointerup",release);
canvas.addEventListener("pointercancel",release);
canvas.addEventListener("pointerleave",e=>{ if(!pointers.has(e.pointerId)){ cursor=null; dirty=true; } });
canvas.addEventListener("wheel",e=>{ e.preventDefault(); anim=null; const p=local(e); cursor=p;
  if(tool==="loupe"){ adjustLoupe(Math.exp(-e.deltaY*0.003)); return; }   // scroll adjusts the lens, not the canvas
  wheelZoom(p.x,p.y,Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0016))); },{passive:false});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

/* ---------------- keyboard ---------------- */
addEventListener("keydown",e=>{
  if(e.code==="Tab"){ e.preventDefault(); toggleUI(); return; }
  if(e.code==="Space"&&!spaceHeld){ spaceHeld=true; setCursor(); e.preventDefault(); return; }
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
  if(mod&&e.key.toLowerCase()==="s"){ e.preventDefault(); exportDrawing(); return; }
  if(e.target&&e.target.tagName==="INPUT") return;
  if((e.key==="Delete"||e.key==="Backspace")&&selected){ e.preventDefault(); deleteSelected(); return; }
  const k=e.key.toLowerCase(), map={p:"pen",b:"brush",m:"marker",l:"line",r:"rect",o:"ellipse",v:"select",e:"eraser",h:"hand",g:"loupe"};
  if(k==="i"){ document.getElementById("imgBtn").click(); }
  else if(k==="f"){ toggleFullscreen(); }
  else if(map[k]) setTool(map[k]);
  else if(k==="="||k==="+")zoomAction(1.3); else if(k==="-"||k==="_")zoomAction(1/1.3);
});
addEventListener("keyup",e=>{ if(e.code==="Space"){ spaceHeld=false; setCursor(); dirty=true; } });

/* ---------------- toolbar ---------------- */
const bar=document.getElementById("bar"), showTools=document.getElementById("showTools");
function setTool(t){ tool=t; document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t)); if(t!=="image"){ pendingImage=null; previewRect=null; } if(t!=="select") selected=null; setCursor(); dirty=true; }
function setCursor(){ canvas.style.cursor=(tool==="hand"||spaceHeld)?(mode==="pan"?"grabbing":"grab"):(tool==="loupe"?"none":(tool==="select"?"default":"crosshair")); }
document.querySelectorAll("[data-tool]").forEach(b=>{ if(b.id==="imgBtn") return; b.onclick=()=>setTool(b.dataset.tool); });
let uiHidden=false;
function toggleUI(){ uiHidden=!uiHidden; bar.style.display=uiHidden?"none":"flex"; showTools.style.display=uiHidden?"flex":"none"; }
document.getElementById("hideBtn").onclick=toggleUI; showTools.onclick=toggleUI;

/* Fullscreen toggle — swaps the icon between "expand" and "collapse" as state changes. */
const fsBtn=document.getElementById("fsBtn");
const FS_EXPAND='<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
const FS_COLLAPSE='<path d="M3 8h3a2 2 0 0 0 2-2V3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/>';
function toggleFullscreen(){ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else { const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el); } }
function syncFsIcon(){ const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  fsBtn.querySelector("svg").innerHTML=on?FS_COLLAPSE:FS_EXPAND; fsBtn.title=on?"Exit fullscreen (F)":"Fullscreen (F)"; }
fsBtn.onclick=toggleFullscreen;
document.addEventListener("fullscreenchange",syncFsIcon); document.addEventListener("webkitfullscreenchange",syncFsIcon);

/* Draggable toolbar: grabbing the grip docks the bar to whichever screen edge the
   pointer is nearest (top/bottom stay horizontal, left/right become a vertical column). */
const DOCKS=["top","bottom","left","right"];
function setDock(side){ if(!DOCKS.includes(side)) side="top";
  bar.classList.remove("dock-top","dock-bottom","dock-left","dock-right"); bar.classList.add("dock-"+side);
  try{ localStorage.setItem("infinidraw.dock",side); }catch(e){} }
function nearestDock(x,y){ const d={top:y,bottom:innerHeight-y,left:x,right:innerWidth-x};
  return Object.keys(d).reduce((a,b)=>d[b]<d[a]?b:a); }
setDock((()=>{ try{ return localStorage.getItem("infinidraw.dock"); }catch(e){ return null; } })()||"top");
const grip=document.getElementById("barGrip"); let dockDrag=false;
grip.addEventListener("pointerdown",e=>{ dockDrag=true; grip.setPointerCapture(e.pointerId); bar.classList.add("dragging"); e.preventDefault(); });
grip.addEventListener("pointermove",e=>{ if(dockDrag) setDock(nearestDock(e.clientX,e.clientY)); });
function endDock(e){ if(!dockDrag) return; dockDrag=false; bar.classList.remove("dragging"); try{ grip.releasePointerCapture(e.pointerId); }catch(_){} }
grip.addEventListener("pointerup",endDock); grip.addEventListener("pointercancel",endDock);

const swatches=document.getElementById("swatches");
function activateSwatch(el){ swatches.querySelectorAll(".sw").forEach(s=>s.classList.remove("active")); el.classList.add("active"); }
swatches.querySelectorAll(".sw[data-color]").forEach(sw=>{ sw.onclick=()=>{ color=sw.dataset.color; activateSwatch(sw); if(tool==="eraser")setTool("pen"); }; });
const cc=document.getElementById("customColor"); cc.oninput=()=>{ color=cc.value; activateSwatch(cc.closest(".sw")); if(tool==="eraser")setTool("pen"); };
const bgPick=document.getElementById("bgColorPick"), bgDot=document.getElementById("bgDot");
function applyBg(){ document.body.style.background=bgColor||""; if(bgColor){ bgDot.style.background=bgColor; bgPick.value=bgColor; } dirty=true; }  // erased/empty areas show the page bg through the transparent canvas
bgPick.oninput=()=>{ bgColor=bgPick.value; applyBg(); };
document.getElementById("size").oninput=e=>{ size=+e.target.value; dirty=true; };
document.getElementById("opacity").oninput=e=>{ opacity=+e.target.value/100; dirty=true; };
document.getElementById("undo").onclick=undo;
document.getElementById("redo").onclick=redo;
document.getElementById("zoomIn").onclick=()=>zoomAction(1.3);
document.getElementById("zoomOut").onclick=()=>zoomAction(1/1.3);
document.getElementById("zoomOuter").onclick=()=>zoomToExtreme(true);
document.getElementById("zoomInner").onclick=()=>zoomToExtreme(false);
document.getElementById("clear").onclick=()=>{ if(confirm("Start a new canvas? This clears everything.")){ root=makeNode(); current=root; camX=camY=0; camScale=VIEW; targetScale=VIEW; pVel={x:0,y:0}; selected=null; history.length=0; future.length=0; updateHist(); dirty=true; } };
bar.addEventListener("pointerdown",e=>e.stopPropagation());
showTools.addEventListener("pointerdown",e=>e.stopPropagation());

const hint=document.getElementById("hint"); let hintTimer;
function hintFlash(msg){ hint.classList.remove("fade"); hint.innerHTML="<span>"+msg+"</span>"; clearTimeout(hintTimer); hintTimer=setTimeout(()=>hint.classList.add("fade"),3200); }
setTimeout(()=>hint.classList.add("fade"),7000);

/* ---------------- go ---------------- */
resize(); setTool("pen"); updateHist(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
