<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Infinite Zoom Studio</title>
<style>
  :root{ --paper:#f7f6f2; --bar:#22242a; --bar-edge:#34373f; --muted:#9aa0ab; --text:#eef0f4; --accent:#2dd4bf; --accent-ink:#0b1512; --icon-scale:1; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 42%, #faf9f5 0%, var(--paper) 58%, #efece4 100%);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  /* touch-action:none lives on the canvas (and, further down, on the few widgets with their own
     custom pointer-drag: panel headers, the colour picker's SV box) rather than on html/body —
     a touch-action restriction on an ancestor can't be reopened by a descendant (the effective
     value is the INTERSECTION down the tree), so a blanket none here would permanently block
     touch-scrolling anywhere nested under it, including the toolbar's scrollable icon strip. */
  #c{display:block;position:fixed;inset:0;touch-action:none}

  .bar{position:fixed;display:flex;align-items:center;gap:5px;
    padding:7px;background:color-mix(in srgb,var(--bar) 92%,transparent);backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid var(--bar-edge);border-radius:16px;box-shadow:0 8px 30px rgba(20,22,28,.28);z-index:10;
    flex-wrap:nowrap}
  /* vh/vw are sized to the browser's LARGEST possible viewport (chrome collapsed) rather than
     what's actually on screen — on mobile, with the URL bar showing, that overshoots the real
     visible area and pushed the pinned Settings/Hide past the bottom edge, unreachable (the bar
     itself never scrolls, only the inner icon strip does). dvh/dvw track the true visible
     viewport instead; older browsers that don't understand them keep the vh/vw fallback. */
  .bar.dock-top{top:14px;left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100vw - 20px);max-width:calc(100dvw - 20px)}
  .bar.dock-bottom{bottom:14px;left:50%;transform:translateX(-50%);flex-direction:row;max-width:calc(100vw - 20px);max-width:calc(100dvw - 20px)}
  .bar.dock-left{left:14px;top:50%;transform:translateY(-50%);flex-direction:column;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}
  .bar.dock-right{right:14px;top:50%;transform:translateY(-50%);flex-direction:column;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px)}
  /* The bulk of the tool icons live in this inner scroller so Settings and Hide — its siblings,
     laid out after it — can never be pushed off-screen or wrapped out of reach: however many
     icons are on, or however cramped the screen, those two stay pinned at a fixed spot and the
     icon strip shrinks (flex:1;min-width/min-height:0) and scrolls internally instead.
     Centered looks right whenever everything fits — especially on an anchored (full-width/
     -height) bar with only a few icons enabled, where flex-start would leave them bunched at one
     end of a bar that spans the whole screen edge. But justify-content:center on a container
     that's actually OVERFLOWING centers the content around the midpoint rather than flush
     against the start, so scrollLeft/Top's minimum (0) lands short of the true start and
     permanently strands whatever spills past the "before" edge with no way to scroll to it. So:
     center by default, and updateBarArrows() below toggles this .overflowing class on/off as
     content actually starts/stops overflowing, switching to flex-start only while it matters. */
  .bar-scroll{display:flex;align-items:center;gap:5px;flex:1 1 auto;min-width:0;overflow:auto;scrollbar-width:none}
  .bar-scroll::-webkit-scrollbar{display:none}
  /* html/body set touch-action:none globally so the canvas can own pinch/pan/draw gestures —
     but that also swallows touch-scrolling here unless explicitly re-enabled per axis, which
     silently strands any overflowing icons on a real touchscreen (mouse-wheel/scrollbar-drag
     testing on desktop won't catch this). */
  .bar.dock-top .bar-scroll,.bar.dock-bottom .bar-scroll{flex-direction:row;justify-content:center;touch-action:pan-x}
  .bar.dock-left .bar-scroll,.bar.dock-right .bar-scroll{flex-direction:column;justify-content:center;min-height:0;touch-action:pan-y}
  .bar-scroll.overflowing{justify-content:flex-start!important}
  /* Scroll arrows: #bar-scroll is already scrollable (overflow:auto above), but on a screen too
     small to fit every icon that has no visible scrollbar and no obvious touch/wheel affordance,
     the overflowing icons were effectively stranded — shown only via updateBarArrows() toggling
     .show once content actually overflows, and only on the end(s) still scrollable. A left-
     pointing chevron reads correctly for "toward the start" on both axes: rotated 90deg it
     points up, which is "toward the start" for a vertical (left/right-docked) column too. */
  .btn.bar-arrow{flex:0 0 auto;display:none}
  .btn.bar-arrow.show{display:inline-flex}
  .bar.dock-left .bar-arrow svg,.bar.dock-right .bar-arrow svg{transform:rotate(90deg)}
  /* During a drag, siblings shift via flipReorder — hovering them as the pointer passes over
     on the way to a new slot shouldn't also light them up as if independently interactive.
     pointer-events:none also blocks the hover-tooltip system below; the dragged element itself
     keeps receiving events regardless (pointer capture bypasses hit-testing entirely). */
  .bar-scroll.tb-dragging .btn{pointer-events:none}
  .sp-toollist.row-dragging .sp-trow{pointer-events:none}
  /* anchored variant: the bar sits flush against its edge (full span, square edge-side corners)
     instead of floating as a centred, margined pill — a fixed dock rather than a movable window. */
  .bar.anchored{border-radius:0;box-shadow:0 4px 20px rgba(20,22,28,.35)}
  .bar.anchored.dock-top{top:0;left:0;right:0;transform:none;max-width:100vw;width:100vw;max-width:100dvw;width:100dvw;border-left:0;border-right:0;border-top:0}
  .bar.anchored.dock-bottom{bottom:0;left:0;right:0;transform:none;max-width:100vw;width:100vw;max-width:100dvw;width:100dvw;border-left:0;border-right:0;border-bottom:0}
  .bar.anchored.dock-left{left:0;top:0;bottom:0;transform:none;max-height:100vh;height:100vh;max-height:100dvh;height:100dvh;border-top:0;border-bottom:0;border-left:0}
  .bar.anchored.dock-right{right:0;top:0;bottom:0;transform:none;max-height:100vh;height:100vh;max-height:100dvh;height:100dvh;border-top:0;border-bottom:0;border-right:0}
  .bar .tool-off{display:none !important}
  .bar .work-only{display:none}
  .bar.work-mode .work-only{display:inline-flex}
  .btn{appearance:none;border:0;cursor:pointer;height:40px;min-width:40px;padding:0 9px;display:inline-flex;
    align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--muted);border-radius:11px;
    font-size:13px;font-weight:600;transition:background .14s,color .14s,transform .06s;-webkit-tap-highlight-color:transparent}
  .btn svg{width:19px;height:19px;display:block}
  .btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
  .btn:active{transform:translateY(1px)}
  .btn.active{background:var(--accent);color:var(--accent-ink)}
  .btn[disabled]{opacity:.35;cursor:default}
  .btn[disabled]:hover{background:transparent;color:var(--muted)}
  /* Icon size setting: only the toolbar's own buttons scale (not Settings/layers/colour-picker
     buttons elsewhere, which also happen to use .btn) — scoped via the #bar ancestor. The drag
     ghost is cloned out to <body> though, so it falls outside that ancestry; it's included by
     name instead so a dragged icon still enlarges/shrinks to match the chosen size. */
  #bar .btn,.reorder-ghost{height:calc(40px * var(--icon-scale));min-width:calc(40px * var(--icon-scale));
    padding:0 calc(9px * var(--icon-scale));border-radius:calc(11px * var(--icon-scale))}
  #bar .btn svg,.reorder-ghost svg{width:calc(19px * var(--icon-scale));height:calc(19px * var(--icon-scale))}
  #bar .bgpick .dot,.reorder-ghost.bgpick .dot{width:calc(16px * var(--icon-scale));height:calc(16px * var(--icon-scale))}
  /* ink + canvas colour buttons: a small swatch dot that opens the built-in picker */
  .bgpick{position:relative;overflow:hidden}
  .bgpick .dot{width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  /* built-in colour picker (replaces the native <input type=color>, which on many phones
     offers only a fixed swatch grid rather than the full spectrum) */
  .cpick{position:fixed;z-index:20;display:flex;flex-direction:column;gap:10px;width:252px;padding:12px;
    background:color-mix(in srgb,var(--bar) 96%,transparent);backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid var(--bar-edge);border-radius:16px;box-shadow:0 12px 40px rgba(20,22,28,.45)}
  .cpick[hidden]{display:none}
  .cp-sv{position:relative;width:228px;height:132px;border-radius:10px;cursor:crosshair;touch-action:none;
    background:linear-gradient(to bottom,rgba(0,0,0,0),#000),linear-gradient(to right,#fff,rgba(255,255,255,0)),#f00}
  .cp-dot{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
  .cp-hue input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;outline:none;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .cp-hue input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #2a2c33;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .cp-hue input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #2a2c33;cursor:pointer}
  .cp-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .cp-prev{width:26px;height:26px;border-radius:7px;border:1px solid var(--bar-edge);flex:0 0 auto}
  .cp-hash{color:var(--muted);font-size:13px}
  .cp-hex{flex:0 0 auto;width:104px;background:#33363e;border:1px solid #454953;border-radius:8px;color:var(--text);
    font:600 13px ui-monospace,monospace;padding:6px 8px;text-transform:uppercase;letter-spacing:.5px;-webkit-appearance:none}
  /* flex:1 1 100% forces its own full-width row below the swatch/hex row rather than
     competing for horizontal space with the hex input — the input's rendered width doesn't
     always shrink as far as min-width:0 nominally allows, which used to push this button
     past the picker's edge, rendering outside its rounded box (and possibly off-screen). */
  .cp-done{height:32px;background:var(--accent);color:var(--accent-ink);flex:1 1 100%;padding:0 12px;justify-content:center}
  .cp-recents{display:flex;flex-wrap:wrap;gap:6px}
  .cp-recents:empty{display:none}
  .cp-recents .rc{width:22px;height:22px;border-radius:6px;cursor:pointer;padding:0;border:1.5px solid rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .cp-recents .rc:hover{transform:scale(1.1)}
  /* Size/opacity are icon buttons in every orientation — a tap pops this slider open on
     demand, so the control never dictates the bar's width (especially on a side dock). */
  .slpop{position:fixed;z-index:20;display:flex;align-items:center;gap:9px;padding:9px 13px;
    background:color-mix(in srgb,var(--bar) 96%,transparent);backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid var(--bar-edge);border-radius:14px;box-shadow:0 12px 40px rgba(20,22,28,.45)}
  .slpop[hidden]{display:none}
  .slpop label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  .slpop input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:4px;background:#4a4e58;border-radius:999px;outline:none}
  .slpop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar);box-shadow:0 0 0 1px var(--bar-edge)}
  .slpop input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar)}
  .slpop .slpop-val{color:var(--text);font-size:12px;font-weight:600;min-width:36px;text-align:right}

  /* live text editor: a transparent textarea overlaid exactly on the text item being typed */
  #textEdit{position:fixed;z-index:15;margin:0;padding:0;border:0;outline:0;background:transparent;resize:none;overflow:hidden;
    white-space:pre;line-height:1.28;font-weight:600;letter-spacing:0;caret-color:var(--accent);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #textEdit[hidden]{display:none}

  .showtools{position:fixed;top:14px;left:14px;z-index:11;display:none;align-items:center;justify-content:center;
    width:44px;height:44px;border:1px solid var(--bar-edge);border-radius:13px;cursor:pointer;color:var(--text);
    background:color-mix(in srgb,var(--bar) 92%,transparent);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(20,22,28,.28);
    transition:background .15s,color .15s,border-color .15s}
  .showtools svg{width:22px;height:22px}
  .showtools:hover{background:color-mix(in srgb,var(--accent) 16%,var(--bar));color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--bar-edge))}
  .showtools:active{filter:brightness(.92)}
  /* anchored variant: a flush edge tab (no floating margin/shadow-drop) — wider and flatter
     than the floating pill, with a chevron hinting which way it opens, so a bar that's flush
     against the screen edge still reads as a grabbable handle once minimised */
  .showtools.anchored{border-radius:0;box-shadow:0 4px 14px rgba(20,22,28,.35)}
  .showtools.anchored.dock-top{top:0;left:50%;transform:translateX(-50%);width:76px;height:22px;border-top:0;border-radius:0 0 10px 10px}
  .showtools.anchored.dock-bottom{bottom:0;top:auto;left:50%;transform:translateX(-50%);width:76px;height:22px;border-bottom:0;border-radius:10px 10px 0 0}
  .showtools.anchored.dock-left{left:0;top:50%;transform:translateY(-50%);width:22px;height:76px;border-left:0;border-radius:0 10px 10px 0}
  .showtools.anchored.dock-right{right:0;left:auto;top:50%;transform:translateY(-50%);width:22px;height:76px;border-right:0;border-radius:10px 0 0 10px}
  .showtools.anchored svg{width:15px;height:15px}
  .showtools.anchored:hover{background:color-mix(in srgb,var(--accent) 26%,var(--bar))}

  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);color:#8a8f99;font-size:12px;
    background:color-mix(in srgb,var(--bar) 80%,transparent);border:1px solid var(--bar-edge);border-radius:999px;
    padding:6px 13px;z-index:9;pointer-events:none;display:flex;gap:10px;align-items:center;white-space:nowrap;
    transition:opacity .5s;max-width:calc(100vw - 20px);max-width:calc(100dvw - 20px);overflow:hidden}
  .hint kbd{font:inherit;font-size:11px;color:var(--text);background:#33363e;border:1px solid #454953;border-bottom-width:2px;border-radius:5px;padding:1px 6px}
  .hint.fade{opacity:0}
  @media (max-width:900px){.hint .desktop-only{display:none}}

  /* layers panel — a movable tool window (drag its header) listing this frame's layers */
  .lpanel{position:fixed;z-index:19;top:64px;right:14px;width:min(238px,calc(100vw - 20px));width:min(238px,calc(100dvw - 20px));display:flex;flex-direction:column;
    background:color-mix(in srgb,var(--bar) 95%,transparent);backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid var(--bar-edge);border-radius:16px;box-shadow:0 14px 44px rgba(20,22,28,.45);color:var(--text);max-height:74vh}
  .lpanel[hidden]{display:none}
  .lp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 8px 9px 13px;
    cursor:grab;border-bottom:1px solid var(--bar-edge);touch-action:none}
  .lp-head:active{cursor:grabbing}
  .lp-title{font-size:13px;font-weight:700;letter-spacing:.3px}
  .lp-x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;
    border-radius:9px;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .lp-x:hover{background:rgba(255,255,255,.07);color:var(--text)}
  .lp-list{overflow:auto;padding:6px;display:flex;flex-direction:column;gap:2px;min-height:44px}
  .lp-row{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .lp-row:hover{background:rgba(255,255,255,.05)}
  .lp-row.active{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .lp-row.hidden-lyr .lp-name{opacity:.4}
  .lp-row .lp-name{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lp-eye,.lp-lock,.lp-zoom{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:0 0 auto;
    width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
  .lp-eye:hover,.lp-lock:hover,.lp-zoom:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .lp-lock.on{color:var(--accent)}
  .lp-eye svg,.lp-lock svg{width:16px;height:16px}
  .lp-zoom{width:24px;height:24px;opacity:.55}
  .lp-zoom:hover{opacity:1}
  .lp-zoom svg{width:15px;height:15px}
  .lp-row:not(:hover) .lp-zoom{opacity:0}
  .lp-row.active .lp-zoom{opacity:.55}
  .lp-row.active .lp-zoom:hover{opacity:1}
  .lp-op{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--bar-edge)}
  .lp-op label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;flex:0 0 auto}
  .lp-op .lp-opval{color:var(--text);font-size:12px;font-weight:600;min-width:38px;text-align:right}
  .lpanel input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:4px;background:#4a4e58;border-radius:999px;outline:none}
  .lpanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar);box-shadow:0 0 0 1px var(--bar-edge)}
  .lpanel input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar)}
  .lp-foot{display:flex;gap:2px;padding:7px;border-top:1px solid var(--bar-edge);justify-content:space-between}
  .lp-foot .btn{height:34px;min-width:34px;padding:0 7px}
  .lp-foot .btn svg{width:18px;height:18px}

  /* custom hover tooltip — replaces the native title bubble (which is slow, unstyled, and can
     clip against a flush-anchored bar) with an immediate, theme-matched one for every tool */
  .tooltip{position:fixed;z-index:30;pointer-events:none;background:#15171b;color:var(--text);
    font-size:12px;font-weight:600;line-height:1.35;padding:6px 10px;border-radius:8px;
    border:1px solid var(--bar-edge);box-shadow:0 6px 20px rgba(20,22,28,.4);
    max-width:220px;white-space:normal;opacity:0;transform:translateY(2px);
    transition:opacity .1s,transform .1s}
  .tooltip.show{opacity:1;transform:translateY(0)}

  /* settings panel — same movable-window pattern as the layers panel, holding the
     "set once and forget" preferences that used to sit permanently on the toolbar */
  .spanel{position:fixed;z-index:19;top:64px;right:14px;width:min(270px,calc(100vw - 20px));width:min(270px,calc(100dvw - 20px));display:flex;flex-direction:column;
    background:color-mix(in srgb,var(--bar) 95%,transparent);backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid var(--bar-edge);border-radius:16px;box-shadow:0 14px 44px rgba(20,22,28,.45);color:var(--text);max-height:74vh}
  .spanel[hidden]{display:none}
  .sp-body{display:flex;flex-direction:column;padding:4px 6px 6px;overflow-y:auto;min-height:0}
  .sp-row{display:flex;align-items:center;gap:10px;padding:9px 8px}
  .sp-row+.sp-row{border-top:1px solid var(--bar-edge)}
  .sp-label{flex:1;font-size:13px;font-weight:600}
  .sp-val{color:var(--text);font-size:12px;font-weight:600;min-width:34px;text-align:right}
  .sp-seg{display:flex;gap:4px}
  .sp-seg .btn{height:30px;min-width:0;padding:0 11px;font-size:12px}
  .sp-dockseg .btn{width:30px;padding:0}
  /* per-icon toolbar toggles — a scrollable checklist (bounded height so ~27 rows don't
     blow out the panel) that shows/hides the matching button out on the actual toolbar */
  .sp-toollist{max-height:224px;overflow-y:auto;display:flex;flex-direction:column;padding:2px 4px 6px}
  .sp-trow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px}
  .sp-trow:hover{background:rgba(255,255,255,.05)}
  .sp-trow.sp-dragging{background:rgba(255,255,255,.08);box-shadow:0 4px 14px rgba(20,22,28,.4)}
  .sp-tname{flex:1;font-size:12.5px;font-weight:600}
  .sp-trow.tool-hidden .sp-tname{opacity:.45}
  .sp-handle{flex:0 0 auto;width:20px;height:26px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:grab;touch-action:none}
  .sp-handle:hover{color:var(--text)}
  .sp-handle svg{width:14px;height:14px}
  /* toolbar drag-to-reorder: siblings jiggle (each with its own small random delay/duration so
     they're not in lockstep) while the pressed icon is picked up — mirrors the iOS-springboard
     cue for "these can be rearranged now" that a plain long-press has no other way to communicate.
     The wiggle animates a wrapper *inside* the button (.jiggle-inner, built on demand by
     wrapForJiggle()) rather than the button itself, because during a drag the button's own
     `transform` is separately driven by the live FLIP reflow below — one element can't animate
     the same CSS property from two independent sources without one clobbering the other. */
  @keyframes tbWiggle{0%{transform:translateY(0) rotate(-8deg) scale(1.05)}50%{transform:translateY(-6px) rotate(8deg) scale(1.09)}100%{transform:translateY(0) rotate(-8deg) scale(1.05)}}
  .jiggle-inner{display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .jiggle-inner.reorder-jiggle{animation:tbWiggle var(--jiggle-dur,.7s) ease-in-out infinite;animation-delay:var(--jiggle-delay,0s);
    filter:drop-shadow(0 5px 7px rgba(20,22,28,.5))}
  .btn.reorder-drag{z-index:60;box-shadow:0 10px 26px rgba(20,22,28,.55);background:color-mix(in srgb,var(--accent) 24%,var(--bar));color:var(--text)}
  .btn.reorder-source-hidden{visibility:hidden}
  .btn.reorder-ghost{position:fixed;transition:none}
  /* Live reflow (FLIP): siblings that get pushed aside as the dragged icon/row passes over them
     animate from their old slot to the new one via flipReorder() below. */
  .btn.reorder-flip,.sp-trow.reorder-flip{transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
  .sp-dockseg .btn svg{width:16px;height:16px}
  .spanel input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;background:#4a4e58;border-radius:999px;outline:none}
  .spanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar);box-shadow:0 0 0 1px var(--bar-edge)}
  .spanel input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--text);cursor:pointer;border:3px solid var(--bar)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<input type="file" id="file" accept="image/*" style="display:none">
<input type="file" id="jsonFile" accept="application/json,.json,.gz" style="display:none">
<textarea id="textEdit" hidden spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>

<button class="showtools" id="showTools" title="Show tools (Tab)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>

<div class="bar dock-top" id="bar">
 <button class="btn bar-arrow" id="barPrev" title="Scroll toolbar" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
 <div class="bar-scroll" id="barScroll">
  <button class="btn active" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7-4-4-7 7-1 5z"/><path d="M15 8l1 1"/></svg></button>
  <button class="btn" data-tool="brush" title="Brush — pressure sensitive (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c2-1 3-3 3-5"/><path d="M14 4l6 6-8 6-4-4z"/></svg></button>
  <button class="btn" data-tool="marker" title="Highlighter (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l4-7 6 3-4 7"/><path d="M9 11l-2 6 4 2 4-4"/><path d="M5 21h6"/></svg></button>
  <button class="btn" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19 19 5"/></svg></button>
  <button class="btn" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
  <button class="btn" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
  <button class="btn" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V5h14v1"/><path d="M12 5v14"/><path d="M9 19h6"/></svg></button>
  <button class="btn" id="imgBtn" data-tool="image" title="Add image (I)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 3 3-2 4 4"/></svg></button>
  <button class="btn work-only" id="flowNodeBtn" data-tool="flownode" title="Node — click again to pick shape (N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="10" rx="2"/><circle cx="3" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="21" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></button>
  <button class="btn work-only" data-tool="connect" title="Connect — drag between two nodes (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2.3"/><circle cx="19" cy="12" r="2.3"/><path d="M7.3 12h9.4"/><path d="m14 9 3 3-3 3"/></svg></button>
  <button class="btn" data-tool="select" title="Select / move / resize (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7 16 2-6 6-2z"/></svg></button>
  <button class="btn" id="regionBtn" data-tool="region" title="Region cut — lift a piece to move (click again to pick shape)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3.5 3"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
  <button class="btn" data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h11"/><path d="M15.5 5.5 20 10a2 2 0 0 1 0 2.8L12 20H8l-4-4a2 2 0 0 1 0-2.8l7.7-7.7a2 2 0 0 1 2.8 0z"/></svg></button>
  <button class="btn" data-tool="hand" title="Pan (H / Space / two fingers)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6.5a1.5 1.5 0 0 0-3 0V11m0-1.5V5a1.5 1.5 0 0 0-3 0v6m0-5.5a1.5 1.5 0 0 0-3 0V12m0-3.5a1.5 1.5 0 0 0-3 0V15c0 3.3 2.7 6 6 6a6 6 0 0 0 6-6v-3"/></svg></button>
  <button class="btn" data-tool="loupe" title="Magnifier — hover to inspect detail (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><circle cx="11" cy="11" r="3"/><path d="m21 21-4.3-4.3"/></svg></button>

  <button class="btn" id="zoomOut" title="Zoom out (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></button>
  <button class="btn" id="zoomIn" title="Zoom in (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></button>

  <button class="btn" id="zoomOuter" title="Fly to outermost drawing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></button>
  <button class="btn" id="zoomInner" title="Fly to innermost drawing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg></button>
  <button class="btn" id="layersBtn" title="Layers panel (Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>

  <button class="btn bgpick" id="inkWrap" title="Ink colour"><span class="dot" id="inkDot" style="background:#23252b"></span></button>
  <button class="btn" data-tool="eyedrop" title="Eyedropper — pick a colour (K, or Alt-click)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 3-1.5 1.5"/><path d="M17.5 4.5 20 7l-8.5 8.5-2.5.5.5-2.5z"/><path d="M9 13l-4 4a1.5 1.5 0 0 0 2 2l4-4"/></svg></button>

  <button class="btn slbtn" id="sizeBtn" title="Brush size"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 7h16" stroke-width="1.2"/><path d="M4 12h16" stroke-width="2.6"/><path d="M4 17h16" stroke-width="4.2"/></svg></button>
  <button class="btn slbtn" id="opacityBtn" title="Opacity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg></button>

  <button class="btn" id="undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <button class="btn" id="clear" title="New canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>

  <button class="btn" id="exportBtn" title="Export drawing (.json)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
  <button class="btn" id="importBtn" title="Import drawing (.json)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
 </div>
 <button class="btn bar-arrow" id="barNext" title="Scroll toolbar" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>

  <button class="btn" id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button class="btn" id="hideBtn" title="Hide toolbar (Tab)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<div class="cpick" id="cpick" hidden>
  <div class="cp-sv" id="cpSV"><i class="cp-dot" id="cpSVDot"></i></div>
  <div class="cp-hue"><input type="range" id="cpHue" min="0" max="360" value="270"></div>
  <div class="cp-foot">
    <span class="cp-prev" id="cpPrev"></span>
    <span class="cp-hash">#</span><input type="text" id="cpHex" maxlength="7" spellcheck="false" autocapitalize="off" autocomplete="off">
    <button class="btn cp-done" id="cpDone">Done</button>
  </div>
  <div class="cp-recents" id="cpRecents"></div>
</div>

<div class="slpop" id="slpop" hidden>
  <label id="slpopLabel"></label>
  <input type="range" id="slpopRange">
  <span class="slpop-val" id="slpopVal"></span>
</div>

<div class="slpop rgpop" id="rgpop" hidden>
  <label>Shape</label>
  <button class="btn rgshape" data-shape="rect" title="Rectangle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.5 3"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg></button>
  <button class="btn rgshape" data-shape="ellipse" title="Ellipse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.5 3"><ellipse cx="12" cy="12" rx="8" ry="7"/></svg></button>
  <button class="btn rgshape" data-shape="lasso" title="Lasso (freehand)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c0-4 3.6-7 8-7s8 3 8 6.5c0 3-2.6 5.5-6 5.5"/><path d="M9 17.5c1.4.4 1.4 1.8.4 2.6"/></svg></button>
</div>

<div class="slpop fnpop" id="fnpop" hidden>
  <label>Shape</label>
  <button class="btn fnshape" data-fnshape="rect" title="Rectangle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg></button>
  <button class="btn fnshape" data-fnshape="diamond" title="Diamond (decision)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 21 12 12 21 3 12Z"/></svg></button>
  <button class="btn fnshape" data-fnshape="ellipse" title="Ellipse (start / end)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="7"/></svg></button>
</div>

<div class="lpanel" id="lpanel" hidden>
  <div class="lp-head" id="lpHead">
    <span class="lp-title">Layers</span>
    <button class="lp-x" id="lpClose" title="Close (Y)">✕</button>
  </div>
  <div class="lp-list" id="lpList"></div>
  <div class="lp-op">
    <label>Opacity</label>
    <input type="range" id="lpOpacity" min="0" max="100" value="100">
    <span class="lp-opval" id="lpOpacityVal">100%</span>
  </div>
  <div class="lp-foot">
    <button class="btn" id="lpAdd" title="New layer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
    <button class="btn" id="lpDup" title="Duplicate layer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></button>
    <button class="btn" id="lpUp" title="Move layer up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
    <button class="btn" id="lpDown" title="Move layer down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button>
    <button class="btn" id="lpMerge" title="Merge down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 21h16"/></svg></button>
    <button class="btn" id="lpDel" title="Delete layer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>
  </div>
</div>

<div class="spanel" id="spanel" hidden>
  <div class="lp-head" id="spHead">
    <span class="lp-title">Settings</span>
    <button class="lp-x" id="spClose" title="Close">✕</button>
  </div>
  <div class="sp-body">
    <div class="sp-row">
      <span class="sp-label">Mode</span>
      <div class="sp-seg">
        <button class="btn" id="modeCreativeBtn" title="Creative — free-form drawing: pen, brush, shapes, text, images">Creative</button>
        <button class="btn" id="modeWorkBtn" title="Work — flowchart / system design: nodes you connect to each other">Work</button>
      </div>
    </div>
    <div class="sp-row">
      <span class="sp-label">Toolbar style</span>
      <div class="sp-seg">
        <button class="btn" id="uiFloatBtn" title="Floating — a movable pill positioned at the edge you choose below">Float</button>
        <button class="btn" id="uiAnchorBtn" title="Anchored — flush against the edge you choose below, still hideable">Anchor</button>
      </div>
    </div>
    <div class="sp-row">
      <span class="sp-label">Toolbar position</span>
      <div class="sp-seg sp-dockseg">
        <button class="btn" id="dockTopBtn" title="Dock to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18" stroke-width="4"/></svg></button>
        <button class="btn" id="dockBottomBtn" title="Dock to bottom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 16h18" stroke-width="4"/></svg></button>
        <button class="btn" id="dockLeftBtn" title="Dock to left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18" stroke-width="4"/></svg></button>
        <button class="btn" id="dockRightBtn" title="Dock to right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M16 3v18" stroke-width="4"/></svg></button>
      </div>
    </div>
    <div class="sp-row">
      <span class="sp-label">Icon size</span>
      <input type="range" id="iconSizeRange" min="80" max="180" step="10" value="100">
      <span class="sp-val" id="iconSizeVal">100%</span>
    </div>
    <div class="sp-row">
      <span class="sp-label">Canvas colour</span>
      <button class="btn bgpick" id="bgWrap" title="Canvas colour"><span class="dot" id="bgDot" style="background:#f7f6f2"></span></button>
    </div>
    <div class="sp-row">
      <span class="sp-label">Grid</span>
      <button class="btn" id="gridBtn" title="Grid: off — click to cycle lines / dots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg></button>
    </div>
    <div class="sp-row">
      <span class="sp-label">Stroke stabiliser</span>
      <input type="range" id="stabRange" min="0" max="90" value="0">
      <span class="sp-val" id="stabVal">0%</span>
    </div>
    <div class="sp-row">
      <span class="sp-label">Mirror</span>
      <div class="sp-seg sp-dockseg">
        <button class="btn" id="mirrorOffBtn" title="Off — pen/brush/marker draw normally"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="m7 7 10 10"/></svg></button>
        <button class="btn" id="mirrorVBtn" title="Vertical axis — mirrors left/right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18" stroke-dasharray="3 2"/></svg></button>
        <button class="btn" id="mirrorHBtn" title="Horizontal axis — mirrors up/down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18" stroke-dasharray="3 2"/></svg></button>
        <button class="btn" id="mirrorBothBtn" title="Both — 4-way symmetry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18" stroke-dasharray="3 2"/><path d="M3 12h18" stroke-dasharray="3 2"/></svg></button>
      </div>
    </div>
    <div class="sp-row">
      <span class="sp-label">Fullscreen</span>
      <button class="btn" id="fsBtn" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    </div>
    <div class="sp-row">
      <span class="sp-label">Toolbar icons</span>
      <span class="sp-val" id="spToolCount"></span>

/* ---------------- rebasing (hidden engine) ---------------- */

/* ---------------- physics ---------------- */

/* ---------------- history ---------------- */

    const pv=wc[(i+2)%4]; resizeInfo={pvx:pv[0],pvy:pv[1],len:Math.max(1e-6,Math.hypot(wc[i][0]-pv[0],wc[i][1]-pv[1]))};

function moveSel(p){ const dx=(p.x-dragLast.x)/camScale, dy=(p.y-dragLast.y)/camScale;

function resizeSel(p){ if(!resizeInfo) return; const f=Math.max(0.05,Math.hypot(wX(p.x)-resizeInfo.pvx,wY(p.y)-resizeInfo.pvy)/resizeInfo.len);

    groupSel.poly=groupPolySnap.map(q=>({x:resizeInfo.pvx+(q.x-resizeInfo.pvx)*f,y:resizeInfo.pvy+(q.y-resizeInfo.pvy)*f})); markDirty(current); dirty=true; return; }
  if(!selected||!transformSnap) return; scaleFromSnap(selected,transformSnap,resizeInfo.pvx,resizeInfo.pvy,f); markDirty(current); dirty=true; }
function endTransform(){
  if(groupSel){ if(groupGeomBefore){ const after=groupSel.items.map(geomOf); if(JSON.stringify(after)!==JSON.stringify(groupGeomBefore)) pushHist({type:"items",node:current,before:groupBefore,after:current.items.map(cloneItem)}); }
    groupBefore=groupGeomBefore=groupSnap=groupPolySnap=null; resizeInfo=null; dragLast=null; return; }
  if(selected&&transformSnap){ const after=geomOf(selected); const changed=JSON.stringify(after)!==JSON.stringify(transformSnap); if(changed) pushHist({type:"transform",node:current,item:selected,before:transformSnap,after}); } transformSnap=null; resizeInfo=null; dragLast=null; bendInfo=null; }
function deleteSelected(){
  if(groupSel){ const before=current.items.map(cloneItem); current.items=current.items.filter(it=>groupSel.items.indexOf(it)<0);   // drop the lifted pieces; the hole stays
    markDirty(current); pushHist({type:"items",node:current,before,after:current.items.map(cloneItem)}); groupSel=null; dirty=true; return; }
  if(!selected) return;

  }
  const i=current.items.indexOf(selected); if(i>=0){ current.items.splice(i,1); pushHist({type:"erase",node:current,removed:[{item:selected,i}]}); markDirty(current); } selected=null; dirty=true; }

/* ---------------- region cut (Photoshop-style lift) ----------------
   Draw a rectangle / ellipse / lasso; the content inside is lifted into a floating VECTOR
   selection (the actual strokes/shapes/images, each clipped INTO the region via a `keep`
   polygon — so it stays full resolution at any zoom) and a matching hole is punched into the
   items underneath (a `clip` polygon per item). It reads like cutting a piece out and moving
   it, and because the piece is vector it never blurs the way a pixel snapshot would. */
function regionStart(p){ regionDraft = regionShape==="lasso" ? {shape:"lasso",pts:[{x:p.x,y:p.y}]} : {shape:regionShape,x0:p.x,y0:p.y,x1:p.x,y1:p.y}; dirty=true; }
function regionExtend(p){ if(!regionDraft) return;
  if(regionDraft.shape==="lasso"){ const l=regionDraft.pts[regionDraft.pts.length-1]; if(Math.hypot(p.x-l.x,p.y-l.y)>=2) regionDraft.pts.push({x:p.x,y:p.y}); }
  else { regionDraft.x1=p.x; regionDraft.y1=p.y; } dirty=true; }
function regionPolyScreen(rd){                                             // the marquee as a screen-space polygon (ellipse/rect flattened to points)
  if(rd.shape==="lasso") return rd.pts.slice();
  const x0=Math.min(rd.x0,rd.x1),x1=Math.max(rd.x0,rd.x1),y0=Math.min(rd.y0,rd.y1),y1=Math.max(rd.y0,rd.y1);
  if(rd.shape==="ellipse"){ const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=(x1-x0)/2,ry=(y1-y0)/2,N=56,out=[];
    for(let i=0;i<N;i++){ const a=i/N*6.2832; out.push({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}); } return out; }
  return [{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}];
}
function regionCommit(){
  const rd=regionDraft; regionDraft=null; if(!rd){ dirty=true; return; }
  const poly=regionPolyScreen(rd); if(poly.length<3){ dirty=true; return; }
  const bb=polyBBox(poly);
  if(bb.x1-bb.x0<4||bb.y1-bb.y0<4){ dirty=true; hintFlash("Selection too small"); return; }
  performCut(poly);
}
function performCut(polyScreen){
  const wpoly=polyScreen.map(q=>({x:wX(q.x),y:wY(q.y)}));                   // the marquee in world units, anchored to the scene
  const bb=polyBBox(wpoly);
  const before=current.items.map(cloneItem);
  const lifted=[];
  for(const it of current.items.slice()){                                  // slice: we append copies as we go
    if(it.kind==="flownode"||it.kind==="connector") continue;   // structural, not liftable content — a lifted copy would duplicate its fid and confuse connector binding
    const L=layerOf(it); if(L&&(!L.visible||L.locked)) continue;   // don't cut from hidden/locked layers
    const b=itemBounds(it);
    if(b.x1<bb.x0||b.x0>bb.x1||b.y1<bb.y0||b.y0>bb.y1) continue;           // item can't overlap the region
    const copy=cloneItem(it); copy.keep=wpoly.map(q=>({x:q.x,y:q.y}));      // lifted piece: keep only what's inside the region
    lifted.push(copy);
    (it.clips||(it.clips=[])).push({poly:wpoly.map(q=>({x:q.x,y:q.y}))});   // hole: remove what's inside the region from the original
    if(it.kind==="stroke") it.bb=undefined;
  }
  if(!lifted.length){ dirty=true; hintFlash("Nothing to cut here"); return; }
  for(const c of lifted) addItemTo(current,c,curLayer().id);              // floating pieces sit on top of the hole, on the active layer
  const after=current.items.map(cloneItem);
  markDirty(current); pushHist({type:"items",node:current,before,after});
  setTool("select"); selected=null; groupSel={items:lifted,poly:wpoly.map(q=>({x:q.x,y:q.y}))}; dirty=true;
  hintFlash("Cut out — drag to move · corners to resize · Delete to remove");
}

/* ---------------- text tool ----------------
   Text is a first-class vector item ({x,y in world, size in world units, string}). While
   typing it's a transparent <textarea> overlaid exactly on the item (which is hidden during
   the edit); on commit the string bakes into the item and it renders/moves/scales like anything
   else. Clicking the tool on empty space starts a new label; clicking existing text re-edits it. */
const textEdit=document.getElementById("textEdit");
function sizeTextEdit(){ const it=editingText; if(!it) return;
  if(it.kind==="flownode"){                                                 // wrap-and-centre inside the node's own box, instead of the free-growing left-aligned text tool
    const b=normBox(it), x0=sxNow(b.x0),y0=syNow(b.y0),x1=sxNow(b.x1),y1=syNow(b.y1);
    const px=Math.max(1,(y1-y0)*0.28);   // matches the baked render's uncapped scale — no size jump between editing and committed
    textEdit.style.left=(x0+6)+"px"; textEdit.style.top=(y0+6)+"px";
    textEdit.style.width=Math.max(10,x1-x0-12)+"px"; textEdit.style.height=Math.max(10,y1-y0-12)+"px";
    textEdit.style.fontSize=px+"px"; textEdit.style.color=it.color; textEdit.style.textAlign="center"; textEdit.style.whiteSpace="pre-wrap";
    return;
  }
  textEdit.style.textAlign="left"; textEdit.style.whiteSpace="pre";

  textEdit.style.left=sxNow(it.x)+"px"; textEdit.style.top=syNow(it.y)+"px"; textEdit.style.fontSize=px+"px"; textEdit.style.color=it.color;
  ctx.save(); ctx.font=textFontStr(px); let w=0; for(const ln of (textEdit.value||"").split("\n")) w=Math.max(w,ctx.measureText(ln||" ").width); ctx.restore();

function finishTextEdit(){

function textToolTap(p){
  for(let i=current.items.length-1;i>=0;i--){ const it=current.items[i]; const L=layerOf(it); if(L&&(!L.visible||L.locked)) continue; if(it.kind==="text"&&hitItem(it,p.x,p.y,6)){ beginEditText(it,false); return; } }
  const before=current.items.map(cloneItem);

textEdit.addEventListener("input",()=>{ if(editingText){ editingText.text=textEdit.value; editingText._w=null; sizeTextEdit(); dirty=true; } });
textEdit.addEventListener("blur",finishTextEdit);
textEdit.addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Escape"||(e.key==="Enter"&&(e.metaKey||e.ctrlKey))){ e.preventDefault(); textEdit.blur(); } });

/* ---------------- eyedropper ---------------- */
function sampleColorAt(p){                                                  // read the composited pixel under the cursor and adopt it as the ink colour
  const x=Math.max(0,Math.min(canvas.width-1,Math.round(p.x*dpr))), y=Math.max(0,Math.min(canvas.height-1,Math.round(p.y*dpr)));
  try{ const d=ctx.getImageData(x,y,1,1).data; if(d[3]>8){ const hex="#"+hex2(d[0])+hex2(d[1])+hex2(d[2]); setInk(hex); pushRecent(hex); hintFlash("Picked "+hex.toUpperCase()); return true; } }catch(e){}
  if(bgColor){ setInk(bgColor); pushRecent(bgColor); hintFlash("Picked "+bgColor.toUpperCase()); return true; }
  hintFlash("Nothing to pick here"); return false;
}

/* ---------------- duplicate / copy-paste ---------------- */
let clipboard=null;
function selItems(){ if(groupSel) return groupSel.items; if(selected&&current.items.indexOf(selected)>=0) return [selected]; return null; }
function unionPoly(items){ let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0; for(const it of items){ const b=itemBounds(it); if(b.x0<x0)x0=b.x0; if(b.y0<y0)y0=b.y0; if(b.x1>x1)x1=b.x1; if(b.y1>y1)y1=b.y1; } return [{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}]; }
function placeCopies(src,off){
  const before=current.items.map(cloneItem);
  const copies=src.map(it=>{ const c=cloneItem(it); translateItem(c,off,off); return c; });
  for(const c of copies) addItemTo(current,c,layerIndex(c.lyr)>=0?c.lyr:curLayer().id);
  markDirty(current); pushHist({type:"items",node:current,before,after:current.items.map(cloneItem)});
  setTool("select");
  if(copies.length>1){ selected=null; groupSel={items:copies,poly:unionPoly(copies)}; } else { groupSel=null; selected=copies[0]; }
  dirty=true;
}
function copySelection(){ const s=selItems(); if(!s||!s.length) return; clipboard=s.map(cloneItem); hintFlash(s.length===1?"Copied":s.length+" copied"); }
function pasteClipboard(){ if(!clipboard||!clipboard.length) return; placeCopies(clipboard,26/camScale); hintFlash("Pasted"); }
function duplicateSelection(){ const s=selItems(); if(!s||!s.length) return; placeCopies(s,26/camScale); }

/* ---------------- image placement ---------------- */
function placeImage(rect){
  if(!pendingImage) return; const img=pendingImage, ar=img.width/img.height;
  let bw=rect.w, bh=rect.h, cx,cy;
  if(bw<8&&bh<8){ bw=VIEW*0.5; bh=bw/ar; cx=W/2; cy=H/2; } else { cx=rect.x+rect.w/2; cy=rect.y+rect.h/2; }
  let dw=bw, dh=dw/ar; if(dh>bh&&bh>8){ dh=bh; dw=dh*ar; }
  const it={kind:"raster",src:img,x:wX(cx-dw/2),y:wY(cy-dh/2),s:(dw/img.width)/camScale,alpha:1};
  addItemTo(current,it); markDirty(current); pushHist({type:"add",node:current,item:it}); dirty=true;
  pendingImage=null; previewRect=null; selected=it; setTool("select"); hintFlash("Drag to move · drag a corner to resize");
}
document.getElementById("imgBtn").addEventListener("click",()=>{ fileInput.value=""; fileInput.click(); });
fileInput.addEventListener("change",()=>{ const f=fileInput.files&&fileInput.files[0]; if(!f)return; const img=new Image();
  img.onload=()=>{ pendingImage=img; setTool("image"); hintFlash("Drag a box to place the image (or tap once)"); }; img.src=URL.createObjectURL(f); });

/* ---------------- export / import ---------------- */
function serErases(it){ return it.erases&&it.erases.length?{erases:it.erases.map(e=>({base:e.base,pts:e.pts.map(p=>({x:p.x,y:p.y,w:p.w}))}))}:null; }
function serHoles(it){ return it.holes&&it.holes.length?{holes:it.holes.map(h=>({x:h.x,y:h.y,r:h.r}))}:null; }
function serClips(it){ return it.clips&&it.clips.length?{clips:it.clips.map(c=>({poly:c.poly.map(p=>({x:p.x,y:p.y}))}))}:null; }
function serKeep(it){ return it.keep&&it.keep.length?{keep:it.keep.map(p=>({x:p.x,y:p.y}))}:null; }
function serItem(it){ if(it.kind==="raster"){ let data=""; try{ if(it.src.toDataURL) data=it.src.toDataURL("image/png"); else { const cv=document.createElement("canvas"); cv.width=it.src.width; cv.height=it.src.height; cv.getContext("2d").drawImage(it.src,0,0); data=cv.toDataURL("image/png"); } }catch(e){}
    return {kind:"raster",lyr:it.lyr,x:it.x,y:it.y,s:it.s,alpha:it.alpha,data,...serErases(it),...serClips(it),...serKeep(it)}; }
  if(it.kind==="shape") return {kind:"shape",lyr:it.lyr,shape:it.shape,color:it.color,alpha:it.alpha,base:it.base,x0:it.x0,y0:it.y0,x1:it.x1,y1:it.y1,...serErases(it),...serClips(it),...serKeep(it)};
  if(it.kind==="text") return {kind:"text",lyr:it.lyr,x:it.x,y:it.y,size:it.size,text:it.text,color:it.color,alpha:it.alpha,...serClips(it),...serKeep(it)};
  if(it.kind==="flownode") return {kind:"flownode",lyr:it.lyr,fid:it.fid,shape:it.shape,color:it.color,fill:it.fill,alpha:it.alpha,base:it.base,x0:it.x0,y0:it.y0,x1:it.x1,y1:it.y1,text:it.text};
  if(it.kind==="connector") return {kind:"connector",lyr:it.lyr,fid:it.fid,fromId:it.fromId,toId:it.toId,bend:it.bend,color:it.color,base:it.base};
  return {kind:"stroke",lyr:it.lyr,mode:it.mode,color:it.color,alpha:it.alpha,base:it.base,pts:it.pts.map(p=>({x:p.x,y:p.y,w:p.w})),...serErases(it),...serHoles(it),...serClips(it),...serKeep(it)}; }
function serNode(n){ return {items:n.items.map(serItem), children:n.children.map(c=>({x:c.x,y:c.y,k:c.k,node:serNode(c.node)}))}; }
function download(name,blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
function pathToCurrent(){ const p=[]; let n=current; while(n.up){ const ch=n.up, idx=ch.parent.children.indexOf(ch); p.push(idx); n=ch.parent; } return p.reverse(); }
function buildPayload(){ return {app:"infinite-zoom-studio",version:5,bg:bgColor,grid:gridMode,layers:cloneLayers(),active:gActive,view:{path:pathToCurrent(),camX,camY,sc:camScale/VIEW},root:serNode(root)}; }
async function exportDrawing(){
  const data=JSON.stringify(buildPayload());
  try{ if(window.CompressionStream){ const stream=new Blob([data]).stream().pipeThrough(new CompressionStream("gzip"));
    const blob=await new Response(stream).blob(); download("infinite-zoom-drawing.json.gz",blob); return; } }catch(e){}
  download("infinite-zoom-drawing.json",new Blob([data],{type:"application/json"}));
}
function deserItem(o,node){ if(o.kind==="raster"){ const img=new Image(); const it={kind:"raster",lyr:o.lyr,x:o.x,y:o.y,s:o.s,alpha:o.alpha==null?1:o.alpha,src:img,erases:o.erases,clips:o.clips,keep:o.keep}; img.onload=()=>{ markDirty(node); dirty=true; }; img.src=o.data; return it; } return o; }
function normLayer(L){ return {id:L.id,name:L.name||("Layer "+L.id),visible:L.visible!==false,locked:!!L.locked,opacity:L.opacity==null?1:L.opacity}; }
function deserNode(o){ const n=makeNode();
  n.items=(o.items||[]).map(it=>deserItem(it,n));
  n.children=(o.children||[]).map(c=>{ const node=deserNode(c.node); const child={x:c.x,y:c.y,k:c.k,node,parent:n}; node.up=child; return child; }); n.dirty=true; n.bbox=undefined; return n; }
function loadState(o){                                              // rebuild scene + camera from a parsed payload (shared by file import and autosave restore)
  if(o.layers&&o.layers.length){ gLayers=o.layers.map(normLayer); gActive=o.active!=null?o.active:gLayers[0].id; }   // v5: global layer stack
  else { const rl=o.root&&o.root.layers;                                  // v4 migration: fold the old per-frame stacks onto the root's, collapsing auto-created ones
    gLayers=(rl&&rl.length)?rl.map(normLayer):[makeLayer("Layer 1")]; gActive=(o.root&&o.root.active!=null)?o.root.active:gLayers[0].id; }
  for(const L of gLayers) lidCtr=Math.max(lidCtr,L.id);                    // keep the id counter ahead of loaded ids
  root=deserNode(o.root); pVel={x:0,y:0}; selected=null; history.length=0; future.length=0; updateHist();
  const valid=new Set(gLayers.map(L=>L.id)), def=gLayers[0].id;           // orphaned/legacy items fall onto the first layer
  for(const n of allNodes()){ for(const it of n.items){ if(it.lyr==null||!valid.has(it.lyr)) it.lyr=def; if((it.kind==="flownode"||it.kind==="connector")&&it.fid) flowIdCtr=Math.max(flowIdCtr,it.fid); } regroup(n); }   // keep the flownode/connector id counter ahead of loaded ids
  let cur=root, ok=true; const v=o.view||{};                       // restore camera + which frame you were in
  for(const idx of (v.path||[])){ if(cur.children&&cur.children[idx]) cur=cur.children[idx].node; else { ok=false; break; } }
  current=ok?cur:root; camX=v.camX||0; camY=v.camY||0; camScale=(v.sc||1)*VIEW; targetScale=camScale;

  if(o.grid!=null) setGrid(o.grid);                                // restore saved grid overlay
  markDirty(root); dirty=true; refreshLayers(); }
/* A corrupt or incompatible saved/imported drawing must never brick the app — loadState runs
   right before the render loop starts, so an uncaught throw here would silently freeze the
   page (whatever was drawn just before the crash, e.g. a saved canvas colour, stays on screen
   forever with nothing responding). Fall back to a blank canvas instead of leaving it hung. */
function resetToBlankCanvas(){
  root=makeNode(); current=root; gLayers=[makeLayer("Layer 1")]; gActive=gLayers[0].id;
  camX=camY=0; camScale=VIEW; targetScale=VIEW; pVel={x:0,y:0}; selected=null;
  history.length=0; future.length=0; updateHist();
  bgColor=null; applyBg(); markDirty(root); dirty=true; refreshLayers();
}
function importDrawing(text){ let o; try{ o=JSON.parse(text); }catch(e){ hintFlash("Couldn't read that file"); return; }
  if(!o||!o.root){ hintFlash("Not a valid drawing file"); return; }
  try{ loadState(o); hintFlash("Drawing loaded"); }
  catch(err){ console.error("Couldn't load that drawing:",err); resetToBlankCanvas(); hintFlash("That file wouldn't load — reset to a blank canvas"); } }

/* Autosave: persist the whole scene to localStorage so a closed/reopened tab resumes where
   it left off. (Cookies can't hold this — ~4KB cap and sent on every request.) Writes are
   debounced and skipped mid-interaction so transient draft/erase state never lands on disk. */
const SAVE_KEY="infinidraw.autosave"; let saveTimer=null;
function saveLocal(){
  if(mode!==null||draft){ scheduleSave(); return; }                // an interaction is live — defer until it settles
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(buildPayload())); }catch(e){}   // quota exceeded / private mode: silently skip
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,1000); }
function restoreLocal(){ let text; try{ text=localStorage.getItem(SAVE_KEY); }catch(e){ return; }
  if(!text) return; let o; try{ o=JSON.parse(text); }catch(e){ return; } if(!o||!o.root) return;
  try{ loadState(o); }
  catch(err){                                    // this runs right before the render loop starts — an uncaught throw here would
    console.error("Couldn't restore your last drawing, starting fresh:",err);   // freeze the page (e.g. a saved black canvas colour applies, then nothing ever responds)
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}   // don't keep failing on this same save every reload
    resetToBlankCanvas(); hintFlash("Couldn't load your last drawing — starting fresh");
  } }
addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){ saveLocal(); return; }   // flush before the tab is backgrounded/closed

  if((tool==="pen"||tool==="brush"||tool==="marker"||tool==="line"||tool==="rect"||tool==="ellipse"||tool==="text"||tool==="region"||tool==="image"||tool==="flownode"||tool==="connect")&&camScale>=VIEW/CHILD_K) reframe(true);

function release(e){
  pointers.delete(e.pointerId);

  else if(mode==="erase"){ commitErase(); mode=null; }

  else if(mode==="region"){ regionCommit(); mode=null; }
  else if(mode==="placeimg"){ placeImage(previewRect||{x:cursor.x,y:cursor.y,w:0,h:0}); placeAnchor=null; mode=null; }

/* ---------------- keyboard ---------------- */
addEventListener("keydown",e=>{
  if(e.code==="Tab"){ e.preventDefault(); toggleUI(); return; }
  if(e.code==="Space"&&!spaceHeld){ spaceHeld=true; setCursor(); e.preventDefault(); return; }
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
  if(mod&&e.key.toLowerCase()==="s"){ e.preventDefault(); exportDrawing(); return; }
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;   // typing in a field / the text editor: leave native keys alone
  if(mod&&e.key.toLowerCase()==="c"){ e.preventDefault(); copySelection(); return; }
  if(mod&&e.key.toLowerCase()==="v"){ e.preventDefault(); pasteClipboard(); return; }
  if(mod&&e.key.toLowerCase()==="d"){ e.preventDefault(); duplicateSelection(); return; }
  if((e.key==="Delete"||e.key==="Backspace")&&(selected||groupSel)){ e.preventDefault(); deleteSelected(); return; }
  const k=e.key.toLowerCase(), map={p:"pen",b:"brush",m:"marker",l:"line",r:"rect",o:"ellipse",v:"select",e:"eraser",h:"hand",g:"loupe",t:"text",k:"eyedrop"};
  if(workMode){ map.n="flownode"; map.c="connect"; }   // Node/Connect shortcuts only do anything once their tools are actually on the toolbar
  if(k==="i"){ document.getElementById("imgBtn").click(); }
  else if(k==="f"){ toggleFullscreen(); }
  else if(k==="y"){ toggleLayers(); }
  else if(map[k]) setTool(map[k]);
  else if(k==="="||k==="+")zoomAction(1.3); else if(k==="-"||k==="_")zoomAction(1/1.3);

addEventListener("keyup",e=>{ if(e.code==="Space"){ spaceHeld=false; setCursor(); dirty=true; } });

/* ---------------- toolbar ---------------- */
const bar=document.getElementById("bar"), barScroll=document.getElementById("barScroll"), showTools=document.getElementById("showTools");

/* Scroll arrows: #bar-scroll can overflow (too many icons, too small a screen, icon size
   turned up) with no visible scrollbar and no obvious touch/wheel affordance — these give it
   one, and hide themselves the moment there's nothing left to scroll to on that side. */
const barPrev=document.getElementById("barPrev"), barNext=document.getElementById("barNext");
function barIsVertical(){ return bar.classList.contains("dock-left")||bar.classList.contains("dock-right"); }
function updateBarArrows(){
  const vertical=barIsVertical();
  const scrollPos=vertical?barScroll.scrollTop:barScroll.scrollLeft;
  const scrollSize=vertical?barScroll.scrollHeight:barScroll.scrollWidth;
  const clientSize=vertical?barScroll.clientHeight:barScroll.clientWidth;
  const overflow=scrollSize-clientSize>1;
  barScroll.classList.toggle("overflowing",overflow);   // centered when everything fits, flush-start (scrollable to the true edge) once it doesn't
  barPrev.classList.toggle("show",overflow&&scrollPos>1);
  barNext.classList.toggle("show",overflow&&scrollPos<scrollSize-clientSize-1);
}
function scrollBarBy(dir){ const vertical=barIsVertical(), amt=dir*140;
  barScroll.scrollBy(vertical?{top:amt,behavior:"smooth"}:{left:amt,behavior:"smooth"}); }
barPrev.addEventListener("click",()=>scrollBarBy(-1));
barNext.addEventListener("click",()=>scrollBarBy(1));
barScroll.addEventListener("scroll",updateBarArrows);
addEventListener("resize",updateBarArrows);
/* Auto-scroll while a drag hovers an arrow (see beginTbDrag/endTbDrag below for start/stop). */
let tbAutoScroll=null;
function tbAutoScrollTick(){ const vertical=barIsVertical();
  if(vertical) barScroll.scrollTop+=tbAutoScroll.dir*12; else barScroll.scrollLeft+=tbAutoScroll.dir*12;
  updateBarArrows();
  if(tbDrag) tbDragTick(tbDrag.lastX,tbDrag.lastY);   // keep live-reflow current even while the pointer itself sits still over the arrow
}
function startTbAutoScroll(dir){ if(tbAutoScroll&&tbAutoScroll.dir===dir) return; stopTbAutoScroll();
  tbAutoScroll={dir,id:setInterval(tbAutoScrollTick,16)}; }
function stopTbAutoScroll(){ if(tbAutoScroll){ clearInterval(tbAutoScroll.id); tbAutoScroll=null; } }
function pointInRect(x,y,r){ return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
function setTool(t){ if(t!=="text") finishTextEdit(); tool=t; document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t)); if(t!=="image"){ pendingImage=null; previewRect=null; } if(t!=="select"){ selected=null; groupSel=null; } if(t!=="region"){ regionDraft=null; closeRgPop(); } if(t!=="flownode") closeFnPop(); setCursor(); dirty=true; }
function setCursor(){ canvas.style.cursor=(tool==="hand"||spaceHeld)?(mode==="pan"?"grabbing":"grab"):(tool==="loupe"?"none":(tool==="select"?"default":(tool==="text"?"text":"crosshair"))); }
document.querySelectorAll("[data-tool]").forEach(b=>{ if(b.id==="imgBtn"||b.id==="regionBtn"||b.id==="flowNodeBtn") return; b.onclick=()=>setTool(b.dataset.tool); });

/* Region-cut tool: first click selects it; clicking again (or the caret) opens the shape chooser. */
const regionBtn=document.getElementById("regionBtn"), rgpop=document.getElementById("rgpop");
function closeRgPop(){ const el=document.getElementById("rgpop"); if(el) el.hidden=true; }
function openRgPop(){ rgpop.querySelectorAll(".rgshape").forEach(b=>b.classList.toggle("active",b.dataset.shape===regionShape)); rgpop.hidden=false; placePopup(rgpop,regionBtn); }
regionBtn.addEventListener("click",()=>{ if(tool!=="region"){ setTool("region"); hintFlash("Region cut ("+regionShape+") — drag to lift a piece. Click the tool again to change shape."); } else if(rgpop.hidden) openRgPop(); else closeRgPop(); });
rgpop.querySelectorAll(".rgshape").forEach(b=>{ b.addEventListener("click",()=>{ regionShape=b.dataset.shape; closeRgPop(); hintFlash("Region shape: "+regionShape); }); });

/* Node tool: same first-click-selects / second-click-opens-shape-chooser pattern as region-cut. */
const flowNodeBtn=document.getElementById("flowNodeBtn"), fnpop=document.getElementById("fnpop");
function closeFnPop(){ const el=document.getElementById("fnpop"); if(el) el.hidden=true; }
function openFnPop(){ fnpop.querySelectorAll(".fnshape").forEach(b=>b.classList.toggle("active",b.dataset.fnshape===flowShape)); fnpop.hidden=false; placePopup(fnpop,flowNodeBtn); }
flowNodeBtn.addEventListener("click",()=>{ if(tool!=="flownode"){ setTool("flownode"); hintFlash("Node ("+flowShape+") — drag to place, then type a label. Click the tool again to change shape."); } else if(fnpop.hidden) openFnPop(); else closeFnPop(); });
fnpop.querySelectorAll(".fnshape").forEach(b=>{ b.addEventListener("click",()=>{ flowShape=b.dataset.fnshape; closeFnPop(); hintFlash("Node shape: "+flowShape); }); });
rgpop.addEventListener("pointerdown",e=>e.stopPropagation());
addEventListener("pointerdown",e=>{ if(!rgpop.hidden && !rgpop.contains(e.target) && !regionBtn.contains(e.target)) closeRgPop(); });
fnpop.addEventListener("pointerdown",e=>e.stopPropagation());
addEventListener("pointerdown",e=>{ if(!fnpop.hidden && !fnpop.contains(e.target) && !flowNodeBtn.contains(e.target)) closeFnPop(); });
let uiHidden=false;
function toggleUI(){ uiHidden=!uiHidden; bar.style.display=uiHidden?"none":"flex"; showTools.style.display=uiHidden?"flex":"none"; }
document.getElementById("hideBtn").onclick=toggleUI; showTools.onclick=toggleUI;

/* Fullscreen toggle — swaps the icon between "expand" and "collapse" as state changes. */
const fsBtn=document.getElementById("fsBtn");
const FS_EXPAND='<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>';
const FS_COLLAPSE='<path d="M3 8h3a2 2 0 0 0 2-2V3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/>';
function toggleFullscreen(){ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else { const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el); } }
function syncFsIcon(){ const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  fsBtn.querySelector("svg").innerHTML=on?FS_COLLAPSE:FS_EXPAND; fsBtn.title=on?"Exit fullscreen (F)":"Fullscreen (F)"; }
fsBtn.onclick=toggleFullscreen;
document.addEventListener("fullscreenchange",syncFsIcon); document.addEventListener("webkitfullscreenchange",syncFsIcon);

/* Place a pop-out (slider / shape chooser) beside its toolbar button, on the side the bar
   is docked to, clamped on-screen. Shared by the size/opacity and region-shape popups. */
function placePopup(el,anchor){
  const r=anchor.getBoundingClientRect(), pw=el.offsetWidth, ph=el.offsetHeight;
  const dock=bar.classList.contains("dock-left")?"left":bar.classList.contains("dock-right")?"right"
    :bar.classList.contains("dock-bottom")?"bottom":"top";
  let left,top;
  if(dock==="left"){ left=r.right+8; top=r.top+r.height/2-ph/2; }
  else if(dock==="right"){ left=r.left-pw-8; top=r.top+r.height/2-ph/2; }
  else if(dock==="bottom"){ left=r.left+r.width/2-pw/2; top=r.top-ph-8; }
  else { left=r.left+r.width/2-pw/2; top=r.bottom+8; }
  el.style.left=Math.max(8,Math.min(innerWidth-pw-8,left))+"px";
  el.style.top=Math.max(8,Math.min(innerHeight-ph-8,top))+"px";
}

/* The "show tools" restore control mirrors the bar's own dock + anchored state, so a
   minimised anchored bar comes back as a flush edge tab (chevron pointing the way it'll
   open) rather than the free-floating pencil pill used when the bar itself floats. */
const TOOLS_ICON='<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';
const CHEV_ICON={top:'<path d="m6 9 6 6 6-6"/>',bottom:'<path d="m18 15-6-6-6 6"/>',left:'<path d="m9 18 6-6-6-6"/>',right:'<path d="m15 18-6-6 6-6"/>'};
function syncShowTools(){
  const side=DOCKS.find(d=>bar.classList.contains("dock-"+d))||"top", anchored=bar.classList.contains("anchored");
  showTools.classList.remove("dock-top","dock-bottom","dock-left","dock-right","anchored");
  if(anchored) showTools.classList.add("anchored","dock-"+side);
  showTools.querySelector("svg").innerHTML=anchored?CHEV_ICON[side]:TOOLS_ICON;
  showTools.title=anchored?"Show toolbar ("+side+" edge)":"Show tools (Tab)";
}
/* Floating utility panels (Settings, Layers) default to a top-right corner and can be
   dragged anywhere — but a flush ANCHORED bar occupies real screen edge, and a panel left
   at a stale dragged position after the window resizes can end up off-screen entirely.
   These two guards keep a panel fully on-screen and nudge it clear of the anchored bar
   whenever it's shown, whenever the bar's dock/style changes, and on every window resize. */
function keepPanelOnScreen(el){
  if(!el || el.hidden) return;
  const r=el.getBoundingClientRect(); if(!r.width||!r.height) return;
  const left=Math.max(8,Math.min(innerWidth-r.width-8,r.left));
  const top=Math.max(8,Math.min(innerHeight-r.height-8,r.top));
  el.style.left=left+"px"; el.style.top=top+"px"; el.style.right="auto";
}
function dodgeAnchoredBar(el){
  if(!el || el.hidden) return;
  if(bar.classList.contains("anchored")){
    const br=bar.getBoundingClientRect(), r=el.getBoundingClientRect();
    const overlap=r.left<br.right&&r.right>br.left&&r.top<br.bottom&&r.bottom>br.top;
    if(overlap){
      if(bar.classList.contains("dock-right")) el.style.left=Math.max(8,br.left-r.width-10)+"px";
      else if(bar.classList.contains("dock-left")) el.style.left=Math.max(8,br.right+10)+"px";
      else if(bar.classList.contains("dock-top")) el.style.top=Math.max(8,br.bottom+10)+"px";
      else if(bar.classList.contains("dock-bottom")) el.style.top=Math.max(8,br.top-r.height-10)+"px";
      el.style.right="auto";
    }
  }
  keepPanelOnScreen(el);
}
function repositionFloatingPanels(){
  dodgeAnchoredBar(document.getElementById("spanel"));
  dodgeAnchoredBar(document.getElementById("lpanel"));
}
addEventListener("resize",repositionFloatingPanels);

/* Toolbar position: which screen edge the bar docks to, chosen from Settings rather than
   dragged — top/bottom stay horizontal, left/right become a vertical column. */
const DOCKS=["top","bottom","left","right"];
const dockBtns={top:document.getElementById("dockTopBtn"),bottom:document.getElementById("dockBottomBtn"),
  left:document.getElementById("dockLeftBtn"),right:document.getElementById("dockRightBtn")};
function setDock(side){ if(!DOCKS.includes(side)) side="top";
  bar.classList.remove("dock-top","dock-bottom","dock-left","dock-right"); bar.classList.add("dock-"+side);
  for(const d of DOCKS) dockBtns[d].classList.toggle("active",d===side);
  try{ localStorage.setItem("infinidraw.dock",side); }catch(e){} syncShowTools(); repositionFloatingPanels(); updateBarArrows(); }
setDock((()=>{ try{ return localStorage.getItem("infinidraw.dock"); }catch(e){ return null; } })()||"top");

/* Toolbar style: "floating" is today's margined, freely-dragged pill; "anchored" pins it

  try{ localStorage.setItem("infinidraw.uistyle",style); }catch(e){} syncShowTools(); repositionFloatingPanels(); updateBarArrows(); }
