  {id:"zoomOut",label:"Zoom out",sel:'#zoomOut'},
  {id:"zoomIn",label:"Zoom in",sel:'#zoomIn'},
  {id:"zoomOuter",label:"Fly to outermost",sel:'#zoomOuter'},
  {id:"zoomInner",label:"Fly to innermost",sel:'#zoomInner'},
  {id:"layersBtn",label:"Layers panel",sel:'#layersBtn'},
  {id:"inkWrap",label:"Ink colour",sel:'#inkWrap'},
  {id:"sizeBtn",label:"Brush size",sel:'#sizeBtn'},
  {id:"opacityBtn",label:"Opacity",sel:'#opacityBtn'},
  {id:"undo",label:"Undo",sel:'#undo'},
  {id:"redo",label:"Redo",sel:'#redo'},
  {id:"clear",label:"New canvas",sel:'#clear'},
  {id:"exportBtn",label:"Export drawing",sel:'#exportBtn'},
  {id:"importBtn",label:"Import drawing",sel:'#importBtn'},
];
const TOGGLE_MAP=new Map(TOGGLE_ITEMS.map(t=>[t.id,t]));
let hiddenTools=new Set();
function loadHiddenTools(){
  try{ hiddenTools=new Set(JSON.parse(localStorage.getItem("infinidraw.hiddenTools")||"[]")); }catch(e){ hiddenTools=new Set(); }
}
function saveHiddenTools(){ try{ localStorage.setItem("infinidraw.hiddenTools",JSON.stringify([...hiddenTools])); }catch(e){} }
function applyToolVisibility(){
  for(const t of TOGGLE_ITEMS){ const el=bar.querySelector(t.sel); if(el) el.classList.toggle("tool-off",hiddenTools.has(t.id)); }
  updateBarArrows();
}

/* Icon order — shared by the toolbar's actual DOM order and the Settings list's row order,
   so dragging in either place keeps both in sync. Settings/Hide aren't in TOGGLE_ITEMS at
   all (they live outside #barScroll, permanently pinned), so they're never part of this. */
let toolOrder=[];
function loadToolOrder(){
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem("infinidraw.toolOrder")||"[]"); }catch(e){ saved=[]; }
  const valid=saved.filter(id=>TOGGLE_MAP.has(id)), seen=new Set(valid);
  for(const t of TOGGLE_ITEMS) if(!seen.has(t.id)) valid.push(t.id);   // tools added since the order was last saved land at the end
  toolOrder=valid;
}
function saveToolOrder(){ try{ localStorage.setItem("infinidraw.toolOrder",JSON.stringify(toolOrder)); }catch(e){} }
function applyToolOrder(){
  for(const id of toolOrder){ const t=TOGGLE_MAP.get(id); const el=t&&bar.querySelector(t.sel); if(el) barScroll.appendChild(el); }   // appendChild on an existing node MOVES it
  renderToolToggles();
}

/* Shared by both drag surfaces (toolbar icons, Settings rows): figure out which sibling the
   pointer is currently past the midpoint of, along the given axis — the slot `movingEl` would
   land in if dropped right now. Hidden siblings (offsetParent null — tool-off / work-mode-hidden)
   are skipped since they don't occupy a visible slot to displace. */
function computeDropTarget(container,movingEl,axis,cx,cy){
  const siblings=[...container.children].filter(c=>c!==movingEl&&c.offsetParent!==null);
  for(const sib of siblings){
    const r=sib.getBoundingClientRect();
    const mid=axis==="x"?r.left+r.width/2:r.top+r.height/2, pos=axis==="x"?cx:cy;
    if(pos<mid) return sib;
  }
  return null;
}
/* FLIP reorder: move `el` to sit before `target` (or append if null), then animate every
   sibling that shifted as a result from its old position to its new one — el itself is left
   untouched (it's either invisible mid-drag or already tracking the pointer separately). */
function flipReorder(container,el,target){
  const kids=[...container.children].filter(c=>c!==el);
  const first=kids.map(c=>[c,c.getBoundingClientRect()]);
  if(target) container.insertBefore(el,target); else container.appendChild(el);
  for(const[c,f]of first){
    const l=c.getBoundingClientRect(), dx=f.left-l.left, dy=f.top-l.top;
    if(!dx&&!dy) continue;
    /* Re-entering this mid-glide (the common case — the target sibling changes on almost every
       pointermove during a real drag) needs the "jump back to where it visually is right now"
       step to be genuinely instant. Without transition:none here it still falls back to the
       base .btn rule's own transform transition (.06s) while .reorder-flip is off, so this jump
       quietly animated too — compounding with the glide that follows into a stutter that read
       as icons "snapping" into place rather than sliding smoothly. */
    c.classList.remove("reorder-flip");
    c.style.transition="none";
    c.style.transform="translate("+dx+"px,"+dy+"px)";
    c.getBoundingClientRect();                          // force layout so the next line transitions from here, not from the target state
    c.style.transition="";
    c.classList.add("reorder-flip");
    c.style.transform="";
    c.addEventListener("transitionend",function done(ev){ if(ev.propertyName==="transform"){ c.classList.remove("reorder-flip"); c.removeEventListener("transitionend",done); } });
  }
}
function wrapForJiggle(btn){
  let inner=btn.querySelector(":scope > .jiggle-inner");
  if(inner) return inner;
  inner=document.createElement("span"); inner.className="jiggle-inner";
  while(btn.firstChild) inner.appendChild(btn.firstChild);
  btn.appendChild(inner);
  return inner;
}
function unwrapJiggle(btn){
  const inner=btn.querySelector(":scope > .jiggle-inner"); if(!inner) return;
  while(inner.firstChild) btn.insertBefore(inner.firstChild,inner);
  inner.remove();
}

const spToolList=document.getElementById("spToolList"), spToolCount=document.getElementById("spToolCount");
const DRAG_HANDLE_ICON='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/></svg>';
function renderToolToggles(){
  spToolList.innerHTML="";
  for(const id of toolOrder){
    const t=TOGGLE_MAP.get(id); if(!t) continue;
    const off=hiddenTools.has(t.id);
    const row=document.createElement("div"); row.className="sp-trow"+(off?" tool-hidden":""); row.dataset.id=t.id;
    const handle=document.createElement("span"); handle.className="sp-handle"; handle.title="Drag to reorder"; handle.innerHTML=DRAG_HANDLE_ICON;
    const name=document.createElement("span"); name.className="sp-tname"; name.textContent=t.label;
    const eye=document.createElement("button"); eye.className="lp-eye"; eye.innerHTML=off?EYE_OFF:EYE_ON;
    eye.title=off?"Show "+t.label+" on the toolbar":"Hide "+t.label+" from the toolbar";
    eye.onclick=()=>{ if(off) hiddenTools.delete(t.id); else hiddenTools.add(t.id);
      saveHiddenTools(); applyToolVisibility(); renderToolToggles(); };
    handle.addEventListener("pointerdown",e=>startSpRowDrag(e,row));
    row.appendChild(handle); row.appendChild(name); row.appendChild(eye); spToolList.appendChild(row);
  }
  spToolCount.textContent=(TOGGLE_ITEMS.length-hiddenTools.size)+"/"+TOGGLE_ITEMS.length;
}

/* Settings list drag-reorder: no gesture ambiguity here (only the eye button is otherwise
   clickable), so the handle can start a drag immediately — no long-press needed. The row
   follows the pointer vertically; other rows live-reflow out of the way via flipReorder as it
   passes over them, so the final order is already correct by the time it's dropped.
   The follow transform is recomputed from the row's live *static* position every move (not
   accumulated from the drag's start point) — flipReorder physically relocates the row in the
   DOM as it passes other rows, which alone would jump the row's layout box; reading the fresh
   static position each time folds that jump into the transform instead of letting it show. */
let spRowDrag=null;
function startSpRowDrag(e,row){
  spRowDrag={row,pointerId:e.pointerId,grabDY:e.clientY-row.getBoundingClientRect().top,lastTarget:row.nextElementSibling||null};
  row.classList.add("sp-dragging"); spToolList.classList.add("row-dragging");
  try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
}
function spRowFollow(e){
  const row=spRowDrag.row;
  const target=computeDropTarget(spToolList,row,"y",e.clientX,e.clientY);
  if(target!==spRowDrag.lastTarget){ flipReorder(spToolList,row,target); spRowDrag.lastTarget=target; }
  row.style.transform="";
  const staticTop=row.getBoundingClientRect().top;
  row.style.transform="translateY("+(e.clientY-spRowDrag.grabDY-staticTop)+"px)";
}
addEventListener("pointermove",e=>{
  if(!spRowDrag||e.pointerId!==spRowDrag.pointerId) return;
  spRowFollow(e);
});
function endSpRowDrag(e){
  if(!spRowDrag||e.pointerId!==spRowDrag.pointerId) return;
  const row=spRowDrag.row; spRowDrag=null;
  row.style.transform=""; row.classList.remove("sp-dragging"); spToolList.classList.remove("row-dragging");
  toolOrder=[...spToolList.children].map(r=>r.dataset.id);
  saveToolOrder(); applyToolOrder();
}
addEventListener("pointerup",endSpRowDrag);
addEventListener("pointercancel",endSpRowDrag);

/* Toolbar drag-to-reorder: long-press an icon (siblings wiggle, the pressed one lifts and
   follows the pointer) — a plain tap still selects the tool and a plain swipe still scrolls
   the strip, since nothing here engages until the hold threshold passes without much
   movement or a release. Event-delegated on #barScroll so it needs no per-button wiring;
   Settings/Hide live outside barScroll entirely, so they're naturally never draggable here.
   Dropping outside the toolbar hides the icon instead of reordering it. */
let tbPress=null, tbDrag=null, suppressNextClick=false;
function tbReorderableEl(target){ const el=target.closest&&target.closest(".btn"); if(!el||!barScroll.contains(el)) return null;
  for(const t of TOGGLE_ITEMS) if(bar.querySelector(t.sel)===el) return el; return null; }
barScroll.addEventListener("pointerdown",e=>{
  if(tbDrag) return; const el=tbReorderableEl(e.target); if(!el) return;
  tbPress={el,startX:e.clientX,startY:e.clientY,pointerId:e.pointerId,
    timer:setTimeout(()=>beginTbDrag(el,e.clientX,e.clientY,e.pointerId),450)};
});
function cancelTbPress(){ if(tbPress){ clearTimeout(tbPress.timer); tbPress=null; } }
function beginTbDrag(el,x,y,pointerId){
  tbPress=null;
  let id=null; for(const t of TOGGLE_ITEMS) if(bar.querySelector(t.sel)===el){ id=t.id; break; } if(!id) return;
  const axis=(bar.classList.contains("dock-left")||bar.classList.contains("dock-right"))?"y":"x";
  const r=el.getBoundingClientRect();
  /* #bar-scroll clips (overflow:auto) so a dragged icon transformed within it can never visibly
     leave the toolbar strip — a free-floating clone appended to <body> as position:fixed has no
     such ancestor to clip against, so it can follow the pointer anywhere on screen. */
  const ghost=el.cloneNode(true);
  ghost.className=el.className+" reorder-ghost reorder-drag";
  ghost.style.cssText="position:fixed;left:0;top:0;margin:0;width:"+r.width+"px;height:"+r.height+"px;pointer-events:none;z-index:999";
  ghost.style.transform="translate("+r.left+"px,"+r.top+"px)";
  document.body.appendChild(ghost);
  el.classList.add("reorder-source-hidden"); barScroll.classList.add("tb-dragging");
  tbDrag={id,el,axis,pointerId,ghost,grabDX:x-r.left,grabDY:y-r.top,lastTarget:el.nextElementSibling||null,lastX:x,lastY:y};
  try{ el.setPointerCapture(pointerId); }catch(_){}
  for(const c of barScroll.children){ if(c===el||c.offsetParent===null) continue;
    c.style.setProperty("--jiggle-delay",(Math.random()*0.3)+"s"); c.style.setProperty("--jiggle-dur",(0.6+Math.random()*0.25)+"s");
    const inner=wrapForJiggle(c); inner.classList.add("reorder-jiggle"); inner.style.animationDirection=Math.random()<0.5?"alternate":"alternate-reverse"; }
  suppressNextClick=true; dirty=true;
}
/* A bigger pickup scale than a hover/press nudge would use — this needs to read unmistakably
   as "lifted and being carried", not just highlighted, per feedback that the previous scale
   was too subtle to tell a move from a remove at a glance. */
function tbDragTick(x,y){
  tbDrag.lastX=x; tbDrag.lastY=y;
  tbDrag.ghost.style.transform="translate("+(x-tbDrag.grabDX)+"px,"+(y-tbDrag.grabDY)+"px) scale(1.55)";
  const br=bar.getBoundingClientRect();
  const inside=x>=br.left&&x<=br.right&&y>=br.top&&y<=br.bottom;
  if(inside){
    const target=computeDropTarget(barScroll,tbDrag.el,tbDrag.axis,x,y);
    if(target!==tbDrag.lastTarget){ flipReorder(barScroll,tbDrag.el,target); tbDrag.lastTarget=target; }
  }
  if(barPrev.classList.contains("show")&&pointInRect(x,y,barPrev.getBoundingClientRect())) startTbAutoScroll(-1);
  else if(barNext.classList.contains("show")&&pointInRect(x,y,barNext.getBoundingClientRect())) startTbAutoScroll(1);
  else stopTbAutoScroll();
}
addEventListener("pointermove",e=>{
  if(tbPress&&e.pointerId===tbPress.pointerId&&Math.hypot(e.clientX-tbPress.startX,e.clientY-tbPress.startY)>6) cancelTbPress();
  if(tbDrag&&e.pointerId===tbDrag.pointerId) tbDragTick(e.clientX,e.clientY);
});
function endTbDrag(e){
  const d=tbDrag; if(!d||e.pointerId!==d.pointerId) return; tbDrag=null;
  stopTbAutoScroll();
  d.ghost.remove(); d.el.classList.remove("reorder-source-hidden"); barScroll.classList.remove("tb-dragging");
  for(const c of barScroll.children) unwrapJiggle(c);
  const br=bar.getBoundingClientRect();
  const outside=e.clientX<br.left||e.clientX>br.right||e.clientY<br.top||e.clientY>br.bottom;
  if(outside){
    hiddenTools.add(d.id); saveHiddenTools(); applyToolOrder(); applyToolVisibility();   // applyToolOrder() also snaps the toolbar DOM back to the last *saved* order, undoing any live-preview shift this cancelled drag caused
    const label=(TOGGLE_MAP.get(d.id)||{}).label||"Icon"; hintFlash(label+" hidden — re-enable it in Settings");
  } else {
    toolOrder=[...barScroll.children].map(el=>{ for(const t of TOGGLE_ITEMS) if(bar.querySelector(t.sel)===el) return t.id; return null; }).filter(Boolean);
    saveToolOrder(); renderToolToggles();
  }
  setTimeout(()=>{ suppressNextClick=false; },50); dirty=true;
}
addEventListener("pointerup",e=>{ cancelTbPress(); endTbDrag(e); });
addEventListener("pointercancel",e=>{ cancelTbPress(); endTbDrag(e); });
barScroll.addEventListener("click",e=>{ if(suppressNextClick){ e.stopPropagation(); e.preventDefault(); suppressNextClick=false; } },true);

loadHiddenTools(); loadToolOrder(); applyToolVisibility(); applyToolOrder();

/* ---------------- hover tooltips ----------------
   A single shared bubble, positioned per-target, standing in for the native title tooltip
   (which is slow, unstyled, and can clip against a flush-anchored bar). The target's `title`
   attribute is swapped for `data-tip` while shown so the OS tooltip never doubles up with it. */
const tooltip=document.getElementById("tooltip");
let tipTimer=null, tipEl=null;
function tipPosition(el){
  const r=el.getBoundingClientRect(), tw=tooltip.offsetWidth, th=tooltip.offsetHeight, pad=9;
  let left=r.left+r.width/2-tw/2, top=r.bottom+pad;
  if(bar.contains(el)){
    if(bar.classList.contains("dock-left")){ left=r.right+pad; top=r.top+r.height/2-th/2; }
    else if(bar.classList.contains("dock-right")){ left=r.left-tw-pad; top=r.top+r.height/2-th/2; }
    else if(bar.classList.contains("dock-bottom")){ top=r.top-th-pad; }
  }
  if(top+th>innerHeight-6 && !bar.classList.contains("dock-left") && !bar.classList.contains("dock-right")) top=r.top-th-pad;
  left=Math.max(6,Math.min(innerWidth-tw-6,left)); top=Math.max(6,Math.min(innerHeight-th-6,top));
  tooltip.style.left=left+"px"; tooltip.style.top=top+"px";
}
function clearTip(){
  clearTimeout(tipTimer); tipTimer=null;
  if(tipEl && tipEl.dataset.tip && !tipEl.hasAttribute("title")) tipEl.setAttribute("title",tipEl.dataset.tip);
  tipEl=null; tooltip.classList.remove("show");
}
document.addEventListener("pointerover",e=>{
  const el=e.target.closest(".btn"); if(!el||el===tipEl) return;
  clearTip();
  const text=el.getAttribute("title"); if(!text) return;
  tipEl=el;
  tipTimer=setTimeout(()=>{
    el.dataset.tip=text; el.removeAttribute("title");
    tooltip.textContent=text; tooltip.classList.add("show"); tipPosition(el);
  },350);
});
document.addEventListener("pointerout",e=>{
  const el=e.target.closest(".btn"); if(!el||el!==tipEl) return;
  if(el.contains(e.relatedTarget)) return;
  clearTip();
});
document.addEventListener("pointerdown",clearTip);
addEventListener("wheel",clearTip,{passive:true});
addEventListener("resize",clearTip);

/* ---------------- go ---------------- */
resize(); setTool("pen"); loadRecents(); restoreLocal(); updateHist(); requestAnimationFrame(loop);
})();
</script>
</body>
